  DOCS.forEach(k=>{if(o.S[k]!=null)S[k]=o.S[k]}); normalize(S,pid); G.touch(...DOCS); G.ensureCycle(true);
};
G.resetAll = function(){const d=defaults(pid); DOCS.forEach(k=>S[k]=d[k]); G.touch(...DOCS); G.ensureCycle(true);};

/* ---------- placar e feed ---------- */
const PT = F.PONTOS;
G.stateOf = id=>id===pid?S:G.peerState[id]||null;
G.pointsOf = function(st,de,ate){
  let min=0,q=0,ok=0,rev=0,sim=0; const dias=new Set();
  st.sessoes.forEach(s=>{if(s.d>=de&&s.d<=ate){min+=s.min; if(s.tipo!=='quiz-ia'){q+=s.q;ok+=s.ok} if(s.min>0||s.q>0) dias.add(s.d)}});
  st.revisoes.forEach(r=>{if(r.done&&r.doneAt>=de&&r.doneAt<=ate) rev++});
  st.simulados.forEach(x=>{if(x.d>=de&&x.d<=ate) sim++});
  return {min,q,ok,rev,sim,dias,pts:Math.floor(min/PT.minutos)+Math.floor(q/PT.questoes)+rev*PT.revisao+sim*PT.simulado};
};
G.periodo = function(k){
  const t=today();
  if(k==='mes'){const d=pd(t); return {de:iso(new Date(d.getFullYear(),d.getMonth(),1)),ate:iso(new Date(d.getFullYear(),d.getMonth()+1,0)),nome:'este mês'}}
  if(k==='temporada') return {de:F.TEMPORADA.de,ate:F.TEMPORADA.ate,nome:F.TEMPORADA.nome};
  const ws=weekStart(t); return {de:ws,ate:addDays(ws,6),nome:'esta semana'};
};
G.placar = function(k){
  const p=G.periodo(k);
  return G.members().map(m=>{const st=G.stateOf(m.id); return st?Object.assign({m,st,streak:G.streak(st)},G.pointsOf(st,p.de,p.ate)):{m,st:null,pts:-1}}).sort((a,b)=>b.pts-a.pts);
};
G.feed = function(n){
  const de=addDays(today(),-21), out=[];
  G.members().forEach(m=>{const st=G.stateOf(m.id); if(!st) return;
    st.sessoes.forEach(s=>{if(s.d>=de&&!s.prova) out.push({id:s.id,by:m.id,d:s.d,tipo:'sessao',s})});   /* prova real aparece uma vez só, como simulado */
    st.simulados.forEach(x=>{if(x.d>=de) out.push({id:x.id,by:m.id,d:x.d,tipo:'simulado',x})})});
  return out.sort((a,b)=>a.d!==b.d?(a.d<b.d?1:-1):(a.id<b.id?1:-1)).slice(0,n||40);
};

/* ---------- fases, marcos pessoais, atividade jurídica ---------- */
const trilha = st=>F.FASES[(st||S).cfg.enam==='sim'?'comEnam':'semEnam'];
G.phases = ()=>trilha();
G.phase = function(){const t=today(), l=trilha(); return l.find(f=>t<=f.ate)||l[l.length-1]};
G.ajDate = function(st){const c=(st||S).cfg.colacao; if(!c) return null; const d=pd(c); d.setFullYear(d.getFullYear()+3); return iso(d)};
G.marcos = function(){
  const m=F.MARCOS.slice(), a=G.ajDate();
  if(a&&S.cfg.aj!=='sim') m.push({d:a,titulo:'Data mais cedo para fechar 3 anos de atividade jurídica',key:true,pessoal:true});
  return m.sort((x,y)=>x.d<y.d?-1:1);
};

/* ---------- ciclo de estudos ---------- */
const NIVEL_MULT={1:1.4,2:1,3:.7};
G.weights = function(){
  const f=G.phase(); const w={};
  DISC.forEach(d=>{
    const base=Math.max(G.expQ(d.id),1.5), m=NIVEL_MULT[S.cfg.niveis[d.id]||2];
    const pm=(f.mult&&f.mult[d.id]!=null)?f.mult[d.id]:1;
    w[d.id]=base*m*pm;
  });
  return w;
};
function buildSeq(){
  const L=30, w=G.weights(); const ids=DISC.map(d=>d.id).filter(id=>w[id]>0);
  const tot=ids.reduce((t,id)=>t+w[id],0)||1;
  const alloc={}; let used=0; const frac=[];
  ids.forEach(id=>{const x=w[id]/tot*L; alloc[id]=Math.max(1,Math.floor(x)); used+=alloc[id]; frac.push([id,x-Math.floor(x)])});
  frac.sort((a,b)=>b[1]-a[1]);
  let i=0; while(used<L&&frac.length){alloc[frac[i%frac.length][0]]++;used++;i++}
  while(used>L){const big=ids.slice().sort((a,b)=>alloc[b]-alloc[a])[0]; if(alloc[big]<=1)break; alloc[big]--;used--}
  const slots=[]; ids.forEach((id,k)=>{const n=alloc[id]; for(let j=0;j<n;j++) slots.push({id,pos:(j+0.5)*L/n+k*0.01})});
  slots.sort((a,b)=>a.pos-b.pos);
  const seq=slots.map(s=>s.id);
  for(let p=1;p<seq.length;p++){ if(seq[p]===seq[p-1]){ for(let q=p+1;q<seq.length;q++){ if(seq[q]!==seq[p-1]&&(q+1>=seq.length||seq[q+1]!==seq[p])){[seq[p],seq[q]]=[seq[q],seq[p]];break} } } }
  return seq;
}
G.cycleSig = ()=>JSON.stringify([G.phase().id,S.cfg.niveis,S.cfg.enam,G.anos('tjsc').length]);
G.ensureCycle = function(force){
  if(!pid) return; const sig=G.cycleSig();
  if(force||S.ciclo.sig!==sig||!S.ciclo.seq.length){
    S.ciclo={seq:buildSeq(),pos:0,sig}; if(S.cfg.onboarded) G.touch('ciclo'); else saveLocal();
  }
};
G.cycleAlloc = ()=>{const a={}; S.ciclo.seq.forEach(id=>a[id]=(a[id]||0)+1); return a};
G.pauta = function(){
  const t=today(); const done=S.sessoes.filter(s=>s.d===t&&s.ciclo);
  const n=Math.max(0,S.cfg.horas-done.length); const next=[]; const L=S.ciclo.seq.length||1;
  for(let i=0;i<n;i++) next.push(S.ciclo.seq[(S.ciclo.pos+i)%L]);
  return {done,next};
};
G.blockPlan = function(){
  const f=G.phase(); if(f.plano) return f.plano; const mix=f.mix, min=50;
  return [['questoes','questões'],['teoria','revisão da teoria'],['lei','lei seca'],['juris','jurisprudência'],['revisao','revisão espaçada']]
    .filter(([k])=>mix[k]).map(([k,l])=>Math.round(min*mix[k]/100/5)*5+"' "+l).filter(s=>!s.startsWith("0'")).join(' · ');
};
/* ritmo: unidades do núcleo da fase ainda sem teoria marcada ÷ dias de estudo até o fim da fase */
G.pace = function(){
  const f=G.phase(), nuc=f.nucleo||DISC.map(d=>d.id), t=today();
  let total=0, feitas=0;
  EDITAL.forEach(e=>{if(nuc.includes(e.disc.id)) e.unidades.forEach(u=>{total++; if(G.unitState(u.key).t) feitas++})});
  const dias=Math.max(1,diff(f.ate,t)+1), diasEstudo=Math.max(1,Math.round(dias*S.cfg.dias/7)), blocos=diasEstudo*S.cfg.horas, restam=total-feitas;
  return {total,feitas,restam,diasEstudo,blocos,porDia:restam/diasEstudo,porBloco:restam/blocos,ate:f.ate};
};

/* ---------- sessões e estatísticas (st = estado de qualquer perfil) ---------- */
G.addSession = function(o){
  const s=Object.assign({id:uid(),d:today(),disc:'civ',min:50,tipo:'misto',q:0,ok:0,nota:'',ciclo:false},o);
  s.min=clamp(+s.min||0,0,600); s.q=clamp(+s.q||0,0,500); s.ok=clamp(+s.ok||0,0,s.q);
  S.sessoes.push(s);
  if(s.ciclo){S.ciclo.pos=(S.ciclo.pos+1)%(S.ciclo.seq.length||1); G.touch('sessoes','ciclo')} else G.touch('sessoes');
  return s;
};
G.delSession = id=>{S.sessoes=S.sessoes.filter(s=>s.id!==id);G.touch('sessoes')};
G.weekStats = function(ref,st){
  st=st||S; const ws=weekStart(ref||today()), we=addDays(ws,6);
  const ss=st.sessoes.filter(s=>s.d>=ws&&s.d<=we);
  return {ws,we,min:ss.reduce((t,s)=>t+s.min,0),q:ss.reduce((t,s)=>t+s.q,0),ok:ss.reduce((t,s)=>t+s.ok,0),meta:st.cfg.horas*st.cfg.dias*60};
};
G.streak = function(st){
  const days=new Set((st||S).sessoes.filter(s=>s.min>0).map(s=>s.d)); let n=0, d=today();
  if(!days.has(d)) d=addDays(d,-1);
  while(days.has(d)){n++;d=addDays(d,-1)}
  return n;
};
G.lastDays = function(n){
  const out=[]; for(let i=n-1;i>=0;i--){const d=addDays(today(),-i); out.push({d,min:S.sessoes.filter(s=>s.d===d).reduce((t,s)=>t+s.min,0)})} return out;
};
G.accByDisc = function(st){
  const a={}; DISC.forEach(d=>a[d.id]={q:0,ok:0,min:0});
  (st||S).sessoes.forEach(s=>{const x=a[s.disc]; if(!x)return; x.min+=s.min; if(s.tipo!=='quiz-ia'){x.q+=s.q;x.ok+=s.ok}});
  return a;
};
G.MINQ = 6;   /* mínimo de questões registradas na disciplina para a projeção confiar no seu percentual (uma prova inteira do ENAM traz de 6 a 16) */
G.projection = function(){
  const acc=G.accByDisc(); const blocos={1:{exp:0,proj:0,semDados:0},2:{exp:0,proj:0,semDados:0},3:{exp:0,proj:0,semDados:0}};
  DISC.forEach(d=>{const e=G.expQ(d.id), x=acc[d.id]; const b=blocos[d.bloco]; b.exp+=e;
    if(x.q>=G.MINQ) b.proj+=e*x.ok/x.q; else {b.proj+=e*0.5; b.semDados+=e}});
  return {blocos,total:blocos[1].proj+blocos[2].proj+blocos[3].proj,semDados:blocos[1].semDados+blocos[2].semDados+blocos[3].semDados};
};
G.projectionEnam = function(st){
  const acc=G.accByDisc(st); let total=0, semDados=0; const linhas=[];
  DISC.filter(d=>d.enam).forEach(d=>{const x=acc[d.id], tem=x.q>=G.MINQ, p=tem?x.ok/x.q:0.5; total+=d.enam*p; if(!tem) semDados+=d.enam; linhas.push({d,p,tem,pts:d.enam*p})});
  return {total,semDados,linhas};
};
G.summary = function(st){
  const w=G.weekStats(null,st), acc=G.accByDisc(st); let q=0, ok=0; DISC.forEach(d=>{q+=acc[d.id].q;ok+=acc[d.id].ok});
  return {semMin:w.min,semMeta:w.meta,semQ:w.q,q,ok,streak:G.streak(st),prog:G.overallProgress(st),enam:G.projectionEnam(st).total,
    totalMin:st.sessoes.reduce((t,s)=>t+s.min,0)};
};

/* ---------- edital / revisões ---------- */
const INTERVALOS = G.INTERVALOS = [1,7,30,90];
G.unitState = (k,st)=>(st||S).edital[k]||{t:0,l:0,q:0,r:0};
G.toggleUnit = function(unit,disc,field){
  const st=Object.assign({t:0,l:0,q:0,r:0},S.edital[unit.key]); st[field]=st[field]?0:1; S.edital[unit.key]=st;
  const docs=['edital'];
  if(field==='t'&&st.t&&!S.revisoes.some(r=>r.key===unit.key&&!r.done)){
    S.revisoes.push({id:uid(),key:unit.key,disc:disc.id,titulo:unit.curto||unit.titulo,due:addDays(today(),INTERVALOS[0]),step:0,done:false}); docs.push('revisoes');
  }
  G.touch(...docs);
};
G.discProgress = function(entry,st){
  const n=entry.unidades.length||1; let pts=0;
  entry.unidades.forEach(u=>{const s=G.unitState(u.key,st); pts+=(s.t?0.4:0)+(s.l?0.2:0)+(s.q?0.4:0)});
  return pts/n;
};
G.overallProgress = function(st){
  let w=0,t=0; EDITAL.forEach(e=>{const x=Math.max(G.expQ(e.disc.id),1); t+=x; w+=x*G.discProgress(e,st)}); return t?w/t:0;
};
G.dueReviews = ()=>S.revisoes.filter(r=>!r.done&&r.due<=today()).sort((a,b)=>a.due<b.due?-1:1);
G.upcomingReviews = ()=>S.revisoes.filter(r=>!r.done&&r.due>today()).sort((a,b)=>a.due<b.due?-1:1);
G.doneReview = function(id){
  const r=S.revisoes.find(x=>x.id===id); if(!r) return;
  r.done=true; r.doneAt=today();
  if(r.key){const st=Object.assign({t:0,l:0,q:0,r:0},S.edital[r.key]); st.r=(st.r||0)+1; S.edital[r.key]=st;}
  const nx=r.step+1;
  if(nx<INTERVALOS.length) S.revisoes.push({id:uid(),key:r.key,disc:r.disc,titulo:r.titulo,due:addDays(today(),INTERVALOS[nx]),step:nx,done:false});
  if(S.revisoes.length>1500) S.revisoes=S.revisoes.filter(x=>!x.done||diff(today(),x.doneAt||today())<120);
  G.touch('revisoes','edital');
};
G.snoozeReview = function(id,n){const r=S.revisoes.find(x=>x.id===id); if(r){r.due=addDays(today(),n);G.touch('revisoes')}};
G.addReview = function(disc,titulo,due){S.revisoes.push({id:uid(),key:'',disc,titulo,due,step:0,done:false});G.touch('revisoes')};

/* ---------- provas reais: folha de respostas corrigida pelo gabarito oficial ---------- */
G.GABS={};
(function(){const el=document.getElementById('d-gabaritos'); if(el){try{G.GABS=JSON.parse(el.textContent)}catch(e){G.dataNotes.push('Gabaritos: JSON inválido')}}})();
G.provaQs = p=>((PROVAS[p.fam]||{})[p.ano]||[]);
G.provaResp = p=>{const n=G.provaQs(p).length, r=(S.provas[p.id]||{}).resp||''; return (r+'-'.repeat(n)).slice(0,n)};
G.marcarProva = function(p,q,letra){
  const n=G.provaQs(p).length, o=S.provas[p.id]=S.provas[p.id]||{}; const a=G.provaResp(p).split('');
  if(q<1||q>n||o.corrigida) return; a[q-1]=a[q-1]===letra?'-':letra; o.resp=a.join(''); G.touch('provas');
};
/* anulada vale ponto para todos, como na correção oficial */
G.corrigirProva = function(p,resp){
  const key=G.GABS[p.id]||'', qs=G.provaQs(p), porDisc={}, blocos={1:0,2:0,3:0}, erros=[]; let ok=0, brancos=0, anul=0;
  qs.forEach(q=>{const k=key[q.q-1]||'?', r=resp[q.q-1]||'-', d=porDisc[q.disc]=porDisc[q.disc]||{n:0,ok:0}; d.n++;
    const certo=k==='X'||r===k; if(k==='X') anul++; else if(r==='-') brancos++;
    if(certo){ok++;d.ok++;blocos[byId[q.disc].bloco]++} else erros.push({q:q.q,disc:q.disc,macro:q.macro,tema:q.tema,marcou:r,gab:k})});
  return {n:qs.length,ok,brancos,anul,porDisc,blocos,erros,semChave:!key||key.length<qs.length};
};
G.salvarProva = function(p,min){
  const resp=G.provaResp(p), r=G.corrigirProva(p,resp), t=today(); min=clamp(+min||0,0,600);
  S.provas[p.id]=Object.assign(S.provas[p.id]||{},{resp,corrigida:true,ok:r.ok,n:r.n,min,em:t});
  S.simulados=S.simulados.filter(x=>x.id!=='prova:'+p.id);
  S.simulados.push(p.fam==='enam'?{id:'prova:'+p.id,tipo:'enam',d:t,nome:p.nome+' (prova real)',total:r.ok}
    :{id:'prova:'+p.id,tipo:'tjsc',d:t,nome:p.nome+' (prova real)',b1:r.blocos[1],b2:r.blocos[2],b3:r.blocos[3]});
  S.sessoes=S.sessoes.filter(s=>s.prova!==p.id);
  let qAcum=0, minAcum=0;   /* reparte os minutos pelo nº de questões, sem sobra de arredondamento */
  Object.entries(r.porDisc).forEach(([disc,d])=>{qAcum+=d.n; const alvo=Math.round(min*qAcum/r.n), m=alvo-minAcum; minAcum=alvo;
    S.sessoes.push({id:uid(),d:t,disc,min:m,tipo:'simulado',q:d.n,ok:d.ok,nota:p.nome,ciclo:false,prova:p.id})});
  G.touch('provas','simulados','sessoes'); return r;
};
G.refazerProva = function(p){
  delete S.provas[p.id]; S.simulados=S.simulados.filter(x=>x.id!=='prova:'+p.id); S.sessoes=S.sessoes.filter(s=>s.prova!==p.id);
  G.touch('provas','simulados','sessoes');
};
G.errosParaCaderno = function(p){
  const r=G.corrigirProva(p,G.provaResp(p)); let n=0;
  r.erros.forEach(e=>{const ref=p.id+':'+e.q; if(S.erros.some(x=>x.ref===ref)) return; n++;
    S.erros.push({id:uid(),ref,d:today(),disc:e.disc,tema:(e.macro+' — '+e.tema).slice(0,140),nota:p.nome+', questão '+e.q+': marquei '+(e.marcou==='-'?'em branco':e.marcou)+', gabarito '+e.gab+'. Escreva aqui a regra correta.',ok:false})});
  if(n) G.touch('erros'); return n;
};

/* ---------- boot do estado ---------- */
loadState(pid);
G.ensureCycle();
})();
</script>
<script>
/* ===================== Gabinete · telas (1/2) ===================== */
(function(){
'use strict';
const G=window.G, F=window.GAB_FACTS, {$,$$,esc,DISC,byId}=G, S=G.S;
const ui=G.ui={route:'hoje',bloco:0,open:new Set(),rxFam:'',rxDisc:'',rxAno:'',rxBusca:'',treino:'quiz',quiz:null,disc:null,expl:null,timer:null,ai:null,dl:null};
const V=G.views={};
const BL={1:'I',2:'II',3:'III'};
const DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DIA3=['dom','seg','ter','qua','qui','sex','sáb'];

const dot=b=>`<i class="dot b${b}" aria-hidden="true"></i>`;
const discOpts=(sel,all,only)=>(all?`<option value="">${esc(all)}</option>`:'')+DISC.filter(d=>!only||only(d)).map(d=>`<option value="${d.id}"${d.id===sel?' selected':''}>${esc(d.nome)}</option>`).join('');
G.discOpts=discOpts; G.dot=dot; G.BL=BL;
const bar=(lab,val,max,cls,txt,tip,tgt)=>`<div class="br"${tip?` data-tip="${esc(tip)}"`:''}><span class="lab">${lab}</span><span class="track"><i class="fill ${cls||''}" style="width:${Math.max(0,Math.min(100,max?val/max*100:0)).toFixed(1)}%"></i>${tgt!=null?`<i class="tgt" style="left:${Math.min(100,tgt/max*100).toFixed(1)}%"></i>`:''}</span><span class="val">${txt}</span></div>`;
G.bar=bar;
const legendBlocos=`<div class="legend"><span>${dot(1)}Bloco I · 40 questões</span><span>${dot(2)}Bloco II · 30</span><span>${dot(3)}Bloco III · 30</span></div>`;

/* ---------- HOJE ---------- */
function alerts(){
  const t=G.today(), sem=S.cfg.enam!=='sim'; let h='';
  h+=F.ALERTAS.filter(a=>t<=a.ate&&(a.se==='todos'||(a.se==='semEnam'&&sem)||(a.se==='comEnam'&&!sem))&&!(a.ocultarSeInscrito&&S.cfg.enam==='inscrito')).map(a=>
    `<div class="alert ${a.tipo==='gold'?'gold':a.tipo==='calm'?'calm':''}"><span class="mark">${esc(a.marca)}</span><div><b>${esc(a.titulo)}</b><span class="small">${esc(a.texto)} ${a.link?`<a href="${esc(a.link[1])}" target="_blank" rel="noopener">${esc(a.link[0])}</a>`:''}</span></div></div>`).join('');
  if(S.cfg.aj!=='sim'){const a=G.ajDate();
    h+=`<div class="alert gold"><span class="mark">3 anos</span><div><b>Atividade jurídica: o relógio que corre em paralelo ao estudo</b><span class="small">${esc(F.AJ.quando)} ${a?`Pela sua colação, a data mais cedo para fechar os 3 anos é <b style="display:inline">${G.fmt(a)}</b> — mire concursos cuja inscrição definitiva caia depois disso.`:'Informe a data da sua colação em Ajustes para ver essa data no calendário.'} O certificado do ENAM vale 2 + 2 anos e cobre essa janela.</span><div class="row" style="margin-top:8px"><button class="btn sm" data-act="aj-info">O que conta e o que não conta</button></div></div></div>`}
  return h;
}
function rail(){
  const t=G.today(); let nextSet=false;
  return `<div class="rail" role="list">`+G.marcos().map(m=>{
    const end=m.fim||m.d, past=end<t; let cls=past?'past':'';
    if(!past&&!nextSet){cls='next';nextSet=true} else if(m.key&&!past) cls='key';
    const dd=past?'encerrado':(m.d<=t?'em andamento':(G.diff(m.d,t)===0?'hoje':'D-'+G.diff(m.d,t)));
    return `<div class="ms ${cls}" role="listitem"><span class="when">${G.fmtShort(m.d)}${m.fim?'–'+G.fmtShort(m.fim):''}/${String(G.pd(end).getFullYear()).slice(2)}${m.previsto?' · prev.':''}${m.pessoal?' · pessoal':''}</span><span class="what">${esc(m.titulo)}</span><span class="dd">${dd}</span></div>`;
  }).join('')+`</div>`;
}
V.hoje=function(){
  const d=new Date(), f=G.phase(), p=G.pauta(), w=G.weekStats(), due=G.dueReviews(), days=G.lastDays(7), mx=Math.max(S.cfg.horas*60,...days.map(x=>x.min)), pc=G.pace();
  const nome=S.cfg.nome?', '+esc(S.cfg.nome.split(' ')[0]):'';
  const pst=pc.restam===0?'good':pc.porBloco<=1?'good':pc.porBloco<=1.5?'warn':'crit';
  let n=0;
  const doneHtml=p.done.map(s=>`<div class="pi done"><span class="n">${++n}</span><div><div class="t">${dot(byId[s.disc].bloco)}${esc(byId[s.disc].nome)}</div><div class="s">${G.hm(s.min)}${s.q?` · ${s.ok}/${s.q} questões`:''}</div></div><div class="acts"><span class="pill good">feito</span></div></div>`).join('');
  const nextHtml=p.next.map((id,i)=>`<div class="pi"><span class="n">${++n}</span><div><div class="t">${dot(byId[id].bloco)}${esc(byId[id].nome)}</div><div class="s">${esc(G.blockPlan())}</div></div><div class="acts row">${i===0&&!ui.timer?`<button class="btn sm primary" data-act="timer-start" data-arg="${id}">Iniciar</button>`:''}<button class="btn sm" data-act="log" data-arg="${id}|1">Concluir</button></div></div>`).join('');
  return `
  <header class="page-head"><div><div class="eyebrow">${DIAS[d.getDay()]}, ${G.fmt(G.today())} · ${esc(f.nome)}</div><h1>Pauta do dia${nome}</h1><p>${esc(f.foco)}</p></div>
    <div class="row"><button class="btn" data-act="log" data-arg="|0">Registrar estudo avulso</button></div></header>
  ${!S.cfg.onboarded?`<div class="alert gold"><span class="mark">1º passo</span><div><b>Ajuste seu perfil para o ciclo ficar sob medida</b><span class="small">A pauta abaixo usa o padrão (4 h por dia, 6 dias, tudo em nível médio). Informe horas, data da colação e seu nível em cada disciplina.</span><div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="go" data-arg="ajustes">Configurar agora</button></div></div></div>`:''}
  ${alerts()}
  <section class="panel"><div class="panel-head"><h2>Calendário</h2><span class="tiny faint">“prev.” = cronograma preliminar do contrato TJSC–FGV, sujeito a confirmação no edital</span></div>${rail()}</section>
  <div class="cols wide-left">
    <div class="stack">
      <section class="panel"><div class="panel-head"><h2>Blocos de hoje</h2><span class="small muted">${S.cfg.horas} blocos de ~50 min + 10 de pausa</span></div>
        <div class="pauta">${doneHtml+nextHtml||'<p class="muted">Pauta cumprida. Se sobrar fôlego, adiante revisões ou faça questões da disciplina mais fraca.</p>'}</div>
        <div class="row"><button class="btn sm ghost" data-act="cycle-skip">Pular próximo bloco</button><button class="btn sm ghost" data-act="go" data-arg="plano">Ver ciclo completo</button></div>
      </section>
      <section class="panel"><div class="panel-head"><h2>Ritmo até ${G.fmtShort(pc.ate)}</h2><span class="pill ${pst}">${pc.restam===0?'núcleo concluído':pst==='good'?'no ritmo':pst==='warn'?'apertado':'acima da capacidade'}</span></div>
        <div class="stats"><div class="stat"><span class="v">${pc.restam}</span><span class="l">unidades do núcleo da fase sem teoria revisada (de ${pc.total})</span></div><div class="stat"><span class="v">${pc.diasEstudo}</span><span class="l">dias de estudo · ${pc.blocos} blocos</span></div><div class="stat"><span class="v">${pc.porDia.toFixed(1)}</span><span class="l">unidades por dia para fechar a tempo</span></div></div>
        <p class="small muted">${pst==='crit'?'Não cabe tudo no tempo que resta. Priorize os capítulos que mais caem (chips em cada disciplina do Edital) e cubra o restante só por questões.':'Regra prática: uma unidade por bloco — questões primeiro, teoria só do que errou, lei seca para fechar.'}</p></section>
    </div>
    <div class="stack">
      <section class="panel"><div class="panel-head"><h2>Semana</h2><span class="small muted">${G.fmtShort(w.ws)}–${G.fmtShort(w.we)}</span></div>
        <div class="stats"><div class="stat"><span class="v">${G.hm(w.min)}</span><span class="l">de ${G.hm(w.meta)} planejadas</span></div>
        <div class="stat"><span class="v">${w.q}</span><span class="l">questões · ${w.q?G.pct(w.ok,w.q)+'% de acerto':'sem registro'}</span></div></div>
        <div class="bars">${days.map(x=>bar(DIA3[G.pd(x.d).getDay()]+' '+G.fmtShort(x.d),x.min,mx,'',x.min?G.hm(x.min):'—',G.fmt(x.d)+': '+G.hm(x.min),S.cfg.horas*60)).join('')}</div>
        <span class="tiny faint">Traço vertical = meta diária de ${S.cfg.horas} h.</span>
      </section>
      ${G.miniPlacar()}
      <section class="panel"><div class="panel-head"><h2>Revisões vencidas</h2><span class="chip"><b>${due.length}</b> pendente(s)</span></div>
        ${due.length?due.slice(0,5).map(r=>`<div class="spread small"><span>${dot(byId[r.disc]?byId[r.disc].bloco:1)} ${esc(r.titulo)}</span><button class="btn sm" data-act="rev-done" data-arg="${r.id}">Revisei</button></div>`).join('')+(due.length>5?`<button class="btn sm ghost" data-act="go" data-arg="revisoes">Ver todas</button>`:''):'<p class="small muted">Nada vencido. As revisões nascem quando você marca a teoria de uma unidade no Edital (1, 7, 30 e 90 dias).</p>'}
      </section>
    </div>
  </div>`;
};

/* ---------- PLANO ---------- */
const MIXL=[['questoes','Questões','--b2'],['teoria','Teoria','--b1'],['lei','Lei seca','--b3'],['juris','Jurisprudência','--s4'],['revisao','Revisão espaçada','--s7']];
V.plano=function(){
  const cur=G.phase(), phases=G.phases(), alloc=G.cycleAlloc(), seq=S.ciclo.seq, L=seq.length||1;
  const ph=phases.map((f,i)=>{
    const ini=i===0?null:G.addDays(phases[i-1].ate,1);
    return `<div class="panel" style="${f.id===cur.id?'border-color:var(--primary)':''}"><div class="panel-head"><h3>${esc(f.nome)} ${f.id===cur.id?'<span class="pill good">fase atual</span>':''}</h3><span class="small muted num">${ini?G.fmt(ini)+' → ':'até '}${G.fmt(f.ate)}</span></div>
      <p class="small muted">${esc(f.foco)}</p>
      <div class="stackbar" role="img" aria-label="Composição do bloco">${MIXL.filter(([k])=>f.mix[k]).map(([k,l,c])=>`<i style="width:${f.mix[k]}%;background:var(${c})" data-tip="${l}: ${f.mix[k]}% do tempo"></i>`).join('')}</div>
      <div class="legend">${MIXL.filter(([k])=>f.mix[k]).map(([k,l,c])=>`<span><i class="dot" style="background:var(${c})"></i>${l} ${f.mix[k]}%</span>`).join('')}</div>${f.mixNota?`<span class="tiny faint">${esc(f.mixNota)}</span>`:''}
      <ul class="small" style="margin:0;padding-left:1.1rem">${f.metas.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`;
  }).join('');
  const rows=DISC.map(d=>{const n=alloc[d.id]||0; return `<tr><td>${dot(d.bloco)} ${esc(d.nome)}</td><td class="n">${d.enam||'—'}</td><td class="n">${G.expQ(d.id).toFixed(1)}</td><td>${['','Fraco','Médio','Forte'][S.cfg.niveis[d.id]||2]}</td><td class="n">${n||'—'}</td><td class="n">${n?G.pct(n,L)+'%':'—'}</td></tr>`}).join('');
  return `
  <header class="page-head"><div><div class="eyebrow">Planejamento · ${esc(S.cfg.nome||'')}</div><h1>Fases e ciclo de estudos</h1><p>Ciclo em vez de grade fixa: a ordem das disciplinas é fixa, o dia da semana não. Se hoje só couberem 3 horas, você faz 3 blocos e amanhã continua de onde parou — nada “atrasa”.</p></div></header>
  <div class="cols">${ph}</div>
  <section class="panel"><div class="panel-head"><h2>Sequência do ciclo (${L} blocos)</h2><div class="row"><button class="btn sm" data-act="cycle-regen">Regerar ciclo</button></div></div>
    <p class="small muted">Peso de cada disciplina = questões que ela rende na prova-alvo da fase × seu nível declarado. O marcador mostra onde você está.</p>
    <div class="row">${seq.map((id,i)=>`<span class="chip ${i===S.ciclo.pos?'on':''}" data-tip="Bloco ${i+1}: ${esc(byId[id].nome)}">${dot(byId[id].bloco)}${esc(byId[id].short)}</span>`).join('')}</div>
    <div class="tbl-wrap"><table class="data"><thead><tr><th>Disciplina</th><th class="n">Questões no ENAM</th><th class="n">Questões no TJSC (média)</th><th>Seu nível</th><th class="n">Blocos/ciclo</th><th class="n">Fatia</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
};

/* ---------- EDITAL ---------- */
function discSummary(e){
  const p=G.discProgress(e), n=e.unidades.length, t=e.unidades.filter(u=>G.unitState(u.key).t).length;
  return `<span class="nm">${dot(e.disc.bloco)}<span>${esc(e.disc.nome)}</span>${e.disc.enam?'<span class="chip">ENAM</span>':''}</span><span class="prog" aria-hidden="true"><i style="width:${(p*100).toFixed(0)}%"></i></span><span class="small num muted">${(p*100).toFixed(0)}% · ${t}/${n}</span>`;
}
V.edital=function(){
  const list=G.EDITAL.filter(e=>!ui.bloco||(ui.bloco===9?e.disc.enam:e.disc.bloco===ui.bloco));
  return `
  <header class="page-head"><div><div class="eyebrow">Edital verticalizado · base: Edital 11/2025 (FGV)</div><h1>Conteúdo programático</h1><p>Marque <b>T</b> quando revisar a teoria, <b>L</b> quando ler a lei seca do ponto e <b>Q</b> quando fizer uma bateria de questões dele. Ao marcar T, a revisão espaçada entra na fila sozinha. Quando o edital de 2026 sair, a lista é atualizada sem perder o que você já marcou.</p></div>
    <div class="stat" style="border:1px solid var(--line);border-radius:10px"><span class="v" id="ed-total">${(G.overallProgress()*100).toFixed(0)}%</span><span class="l">do edital, ponderado pelo peso na prova</span></div></header>
  <div class="spread"><div class="seg" role="group" aria-label="Filtrar">${[[0,'Todas'],[9,'Só ENAM'],[1,'Bloco I'],[2,'Bloco II'],[3,'Bloco III']].map(([b,l])=>`<button data-act="ed-bloco" data-arg="${b}" aria-pressed="${ui.bloco===b}">${l}</button>`).join('')}</div>${legendBlocos}</div>
  <div class="disc-list">${list.map(e=>{
    const rank=G.macroRank(e.disc.id).slice(0,8);
    return `<details class="disc" data-disc="${e.disc.id}"${ui.open.has(e.disc.id)?' open':''}><summary>${discSummary(e)}</summary><div class="disc-body">
      ${rank.length?`<div><div class="eyebrow" style="margin-bottom:6px">O que mais caiu nas provas FGV mapeadas (TJSC e ENAM)</div><div class="row">${rank.map(r=>`<span class="chip" data-tip="${esc(Object.entries(r.anos).map(([a,n])=>a+': '+n).join(' · '))}">${esc(r.macro)} <b>${r.n}</b></span>`).join('')}</div></div>`:''}
      <div>${e.unidades.map(u=>{const s=G.unitState(u.key);return `<div class="unit"><span class="ttl">${esc(u.curto)}${u.resto?`<span class="small faint" style="display:block">${esc(u.resto)}</span>`:''}</span><span class="tg" data-unit="${u.key}">${[['t','T','Teoria'],['l','L','Lei seca'],['q','Q','Questões']].map(([k,l,full])=>`<button data-act="unit" data-arg="${e.disc.id}|${u.key}|${k}" aria-pressed="${!!s[k]}" aria-label="${full}" data-tip="${full}">${l}</button>`).join('')}${s.r?`<button class="rev" disabled data-tip="Revisões concluídas">${s.r}×</button>`:''}</span></div>`}).join('')||'<p class="small muted">Unidades desta disciplina ainda não carregadas.</p>'}</div>
    </div></details>`}).join('')}</div>`;
};
G.refreshDisc=function(id){
  const e=G.EDITAL.find(x=>x.disc.id===id), el=$(`details.disc[data-disc="${id}"] > summary`);
  if(e&&el) el.innerHTML=discSummary(e);
  const t=$('#ed-total'); if(t) t.textContent=(G.overallProgress()*100).toFixed(0)+'%';
};

/* ---------- RAIO-X ---------- */
const fonteCat=f=>{f=G.norm(f); const l=f.includes('lei'), j=f.includes('juris'); return l&&j?'lei+juris':j?'juris':l?'lei':'doutrina'};
const FONTES=[['lei','Letra da lei','--s4'],['lei+juris','Lei + jurisprudência','--s5'],['juris','Jurisprudência','--s6'],['doutrina','Doutrina/conceito','--s7']];
const rxFam=()=>{if(!ui.rxFam) ui.rxFam=(S.cfg.enam!=='sim'&&G.anos('enam').length)?'enam':'tjsc'; return ui.rxFam};
function rxTable(){
  const fam=rxFam(), b=G.norm(ui.rxBusca); let rows=G.allQ(fam).filter(q=>(!ui.rxDisc||q.disc===ui.rxDisc)&&(!ui.rxAno||q.ano===ui.rxAno)&&(!b||G.norm(q.tema+' '+q.macro+' '+q.ref).includes(b)));
  const tot=rows.length; rows=rows.slice(0,120);
  return `<div class="small muted" style="margin-bottom:6px">${tot} questão(ões)${tot>120?' · mostrando as 120 primeiras':''}</div><div class="tbl-wrap scroll-y"><table class="data"><thead><tr><th>Prova</th><th class="n">Nº</th><th>Disciplina</th><th>Capítulo</th><th>Tema cobrado</th><th>Exigiu</th></tr></thead><tbody>${rows.map(q=>`<tr><td class="num">${q.ano}</td><td class="n">${q.q}</td><td>${dot(byId[q.disc].bloco)} ${esc(byId[q.disc].short)}</td><td>${esc(q.macro)}</td><td>${esc(q.tema)}${q.ref?`<div class="tiny faint">${esc(q.ref)}</div>`:''}</td><td>${esc(q.fonte)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nenhuma questão com esse filtro.</td></tr>'}</tbody></table></div>`;
}
function rxRank(){
  if(!ui.rxDisc) return '';
  const r=G.macroRank(ui.rxDisc,rxFam()), mx=r.length?r[0].n:1, d=byId[ui.rxDisc];
  const nac=G.NAC.porDisc[ui.rxDisc]||[], mxn=nac.length?nac[0].pct:1;
  const tot=r.reduce((t,x)=>t+x.n,0)||1;
  const esq=`<div><div class="eyebrow" style="margin-bottom:8px">Nas provas mapeadas aqui <span class="faint">(${tot} questões)</span></div><div class="bars">${r.map(x=>bar(esc(x.macro),x.n,mx,'b'+d.bloco,x.n+' <span class="faint">('+G.pct(x.n,tot)+'%)</span>',x.macro+' — '+Object.entries(x.anos).map(([a,n])=>a+': '+n).join(' · '))).join('')}</div></div>`;
  const dir=nac.length?`<div><div class="eyebrow" style="margin-bottom:8px">Na magistratura estadual do país <span class="faint">(24 certames, 5 anos)</span></div><div class="bars">${nac.slice(0,12).map(x=>bar(esc(x.tema),x.pct,mxn,'',x.pct.toFixed(2).replace('.',',')+'%','Estudo Estratégico — incidência nacional')).join('')}</div>
    <p class="tiny faint">Fonte: Estudo Estratégico (Estratégia Carreiras Jurídicas). Os rótulos são os do próprio documento e não coincidem com os da classificação à esquerda — compare os temas, não as linhas. Onde houver divergência, prevalece a coluna da esquerda: é a banca de vocês.</p></div>`:'';
  return `<div class="cols" style="margin-bottom:14px">${esq}${dir}</div>`;
}
G.rxRefresh=()=>{const el=$('#rx-out'); if(el) el.innerHTML=rxRank()+rxTable()};
V.raiox=function(){
  const fam=rxFam(), anos=G.anos(fam), isE=fam==='enam', all=G.allQ(fam);
  const toggle=`<div class="seg" role="group" aria-label="Prova">${[['enam','ENAM'],['tjsc','TJSC · Juiz Substituto']].map(([k,l])=>`<button data-act="rx-fam" data-arg="${k}" aria-pressed="${fam===k}">${l}</button>`).join('')}</div>`;
  if(!anos.length) return `<header class="page-head"><div><h1>Raio-X das provas</h1><p>Os mapas de prova ${isE?'do ENAM':'do TJSC'} ainda não foram carregados nesta versão.</p></div></header>${toggle}`;
  const discs=DISC.filter(d=>!isE||d.enam), val=d=>isE?d.enam:G.expQ(d.id), mx=Math.max(...discs.map(val));
  const rows=discs.map(d=>`<tr data-tip="${esc(d.nome)}: ${isE?d.enam+' questões por edital':'média de '+G.expQ(d.id).toFixed(1)+' questões por prova'}"><td>${dot(d.bloco)} ${esc(d.nome)}</td><td style="min-width:150px"><i class="inbar" style="width:${(val(d)/mx*100).toFixed(0)}px;max-width:70%;background:var(--b${d.bloco})"></i><span class="num">${isE?d.enam:G.expQ(d.id).toFixed(1)}</span></td>${anos.map(a=>`<td class="n">${G.countQ(fam,a,d.id)||'—'}</td>`).join('')}${isE?'':`<td class="n">${d.enam||'—'}</td>`}<td class="n">${G.NAC.pesoPorDisc[d.id]!=null?G.NAC.pesoPorDisc[d.id].toFixed(2).replace('.',',')+'%':'—'}</td></tr>`).join('');
  const fonte=anos.map(a=>{const c={}, qs=G.PROVAS[fam][a], n=qs.length; qs.forEach(q=>{const k=fonteCat(q.fonte);c[k]=(c[k]||0)+1});
    return `<div class="br" style="grid-template-columns:56px minmax(0,1fr) auto"><span class="lab num">${a}</span><span class="stackbar">${FONTES.map(([k,l,col])=>c[k]?`<i style="width:${c[k]/n*100}%;background:var(${col})" data-tip="${l}: ${c[k]} de ${n} questões"></i>`:'').join('')}</span><span class="val">${G.pct((c['juris']||0)+(c['lei+juris']||0),n)}% c/ juris</span></div>`}).join('');
  const lado=isE
    ? `<section class="panel"><div class="panel-head"><h2>Quantos se habilitam</h2><span class="small muted">% dos presentes</span></div>
        <div class="bars">${F.ENAM.hist.map(h=>bar('ENAM '+h.ed,h.pct,30,'',String(h.pct).replace('.',',')+'%','ENAM '+h.ed+': '+h.hab.toLocaleString('pt-BR')+' habilitados de '+h.insc+' inscritos'+(h.nota?' — '+h.nota:''))).join('')}</div>
        <p class="small muted">${esc(F.ENAM.regras)}</p>
        <p class="small">A taxa despencou para 6,3% em 2025.2 e voltou a 24,4% em 2026.1: a dificuldade oscila, então estude com folga — 62 ou mais em simulado, não 56.</p></section>`
    : `<section class="panel"><div class="panel-head"><h2>O funil do último concurso</h2><span class="small muted">Edital 11/2025</span></div>
        <div class="bars">${F.FUNIL.map(x=>bar(esc(x.etapa),x.n,F.FUNIL[0].n,'',x.n.toLocaleString('pt-BR'),x.etapa+': '+x.n.toLocaleString('pt-BR')+(x.nota?' — '+x.nota:''))).join('')}</div>
        <div class="tbl-wrap"><table class="data"><thead><tr><th>Etapa</th><th class="n">Peso</th><th>Como é</th></tr></thead><tbody>${F.ETAPAS.map(e=>`<tr><td>${esc(e.nome)}</td><td class="n">${e.peso}</td><td class="small">${esc(e.detalhe)}</td></tr>`).join('')}</tbody></table></div></section>`;
  const estilo=isE?(F.ESTILO_ENAM||[]):F.ESTILO, links=isE?(F.LINKS_ENAM||[]):F.LINKS;
  return `
  <header class="page-head"><div><div class="eyebrow">Dados reais · banca FGV</div><h1>Raio-X das provas</h1><p>${all.length} questões ${isE?'das edições anteriores do ENAM':'das provas objetivas de Juiz Substituto do TJSC'}, classificadas uma a uma por disciplina, capítulo, tema e tipo de conhecimento exigido. A classificação é minha (Claude), feita sobre os cadernos oficiais; os PDFs estão nos links ao final.</p></div>${toggle}</header>
  <section class="panel"><div class="panel-head"><h2>Quantas questões cada disciplina rende</h2>${isE?'':legendBlocos}</div>
    <div class="tbl-wrap"><table class="data"><thead><tr><th>Disciplina</th><th>${isE?'Por edital':'Média por prova'}</th>${anos.map(a=>`<th class="n">${a}</th>`).join('')}${isE?'':'<th class="n">ENAM</th>'}<th class="n" data-tip="Peso da disciplina em 24 certames de magistratura estadual do país (Estudo Estratégico)">Nacional</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small muted">${isE?'A distribuição do ENAM é fixada em edital: Constitucional sozinha vale 20% da prova; Humanística e Direitos Humanos, juntas, 15%.':'Mínimos para não ser eliminado: 12 acertos no Bloco I, 9 no II, 9 no III e 60 no total. Coluna ENAM = nº de questões da disciplina no Exame Nacional.'}</p></section>
  <div class="cols">
    <section class="panel"><div class="panel-head"><h2>O que a questão exige</h2></div><div class="bars">${fonte}</div>
      <div class="legend">${FONTES.map(([k,l,c])=>`<span><i class="dot" style="background:var(${c})"></i>${l}</span>`).join('')}</div>
      <ul class="small prose">${estilo.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>
    ${lado}
  </div>
  <section class="panel"><div class="panel-head"><h2>Explorar os temas cobrados</h2></div>
    <div class="form-grid"><div class="field"><label for="rx-disc">Disciplina</label><select id="rx-disc" data-chg="rx-disc">${discOpts(ui.rxDisc,'Todas',isE?d=>d.enam:null)}</select></div>
      <div class="field"><label for="rx-ano">Prova</label><select id="rx-ano" data-chg="rx-ano"><option value="">Todas</option>${anos.map(a=>`<option${a===ui.rxAno?' selected':''}>${a}</option>`).join('')}</select></div>
      <div class="field"><label for="rx-busca">Buscar tema, lei ou súmula</label><input type="search" id="rx-busca" data-inp="rx-busca" value="${esc(ui.rxBusca)}" placeholder="ex.: prescrição, controle de convencionalidade, IRDR"></div></div>
    <div id="rx-out">${rxRank()+rxTable()}</div></section>
  <section class="panel"><div class="panel-head"><h2>Fontes oficiais</h2></div><div class="row">${links.map(([l,u])=>`<a class="chip" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join('')}</div>${G.dataNotes.length?`<p class="tiny faint">${esc(G.dataNotes.join(' · '))}</p>`:''}</section>`;
};
})();
</script>
<script>
/* ===================== Gabinete · grupo (placar, feed, progresso individual, conexão) ===================== */
(function(){
'use strict';
const G=window.G, F=window.GAB_FACTS, {$,esc,DISC,byId,bar,dot}=G, S=G.S, ui=G.ui, V=G.views;
const DIA3=['dom','seg','ter','qua','qui','sex','sáb'];
const EMOJIS=['👏','🔥','💪','🎯'];
const TIPO={misto:'estudo',teoria:'teoria',questoes:'questões',lei:'lei seca',juris:'jurisprudência',revisao:'revisão',simulado:'simulado',discursiva:'discursiva/sentença','quiz-ia':'quiz com IA'};
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const nomeDe=id=>(G.member(id)||{}).nome||'Alguém';
const avatar=m=>`<span class="avatar" aria-hidden="true">${esc(ini(m.completo||m.nome))}</span>`;
ui.periodo='semana'; ui.membro='';

/* ---------- conexão do grupo ---------- */
function conexao(){
  const k=G.backend.kind;
  if(k==='artifact') return `<section class="panel"><div class="panel-head"><h2>Grupo sincronizado pelo Claude</h2><span class="pill good">na nuvem</span></div><p class="small muted">Esta versão guarda os dados no banco do próprio Claude, que só aceita contas da mesma organização. Para alguém participar pelo celular sem conta Claude, use a versão hospedada (site), que sincroniza por um banco gratuito do Firebase — o passo a passo está no arquivo COMO-PUBLICAR.md da pasta do projeto.</p></section>`;
  if(k==='rtdb'){const link=G.inviteLink();
    return `<section class="panel"><div class="panel-head"><h2>Grupo conectado</h2><span class="pill ${G.backend.on?'good':'warn'}">${G.backend.on?'sincronizando':'sem conexão agora'}</span></div>
      <p class="small muted">Envie o convite para quem vai estudar com você. Quem abre o link entra direto no grupo e cria o próprio perfil. Guarde o convite: ele é a chave do grupo.</p>
      <div class="field"><label for="cv-link">${link?'Link de convite':'Código de convite (cole em “Tenho um convite” no outro aparelho)'}</label><input type="text" id="cv-link" readonly value="${esc(link||G.inviteCode())}"></div>
      <div class="row"><button class="btn primary" data-act="copiar" data-arg="cv-link">Copiar convite</button><button class="btn" data-act="grupo-atualizar">Atualizar agora</button><button class="btn danger" data-act="grupo-sair">Desconectar este aparelho</button></div></section>`}
  if(window.claude) return '';
  return `<section class="panel"><div class="panel-head"><h2>Conectar o grupo</h2><span class="pill warn">só neste aparelho</span></div>
    <p class="small muted">Sem conexão, o progresso fica apenas neste navegador e ninguém mais o vê. Para o placar e o feed funcionarem entre aparelhos, crie o grupo com a URL de um Realtime Database gratuito do Firebase (passo a passo no COMO-PUBLICAR.md) ou entre com o convite de quem já criou.</p>
    <div class="form-grid"><div class="field"><label for="gp-url">Criar grupo · URL do Realtime Database</label><input type="text" id="gp-url" placeholder="https://seu-projeto-default-rtdb.firebaseio.com" autocomplete="off"></div><div class="field"><label for="gp-conv">Tenho um convite · link ou código</label><input type="text" id="gp-conv" autocomplete="off"></div></div>
    <div class="row"><button class="btn primary" data-act="grupo-criar">Criar grupo</button><button class="btn" data-act="grupo-entrar">Entrar com convite</button></div></section>`;
}
G.conexaoHtml=conexao;

/* ---------- escolha de perfil ---------- */
V.perfis=function(){
  const ms=G.members();
  return `
  <header class="page-head"><div><div class="eyebrow">Gabinete · Magistratura SC</div><h1>Quem vai estudar agora?</h1><p>Cada pessoa tem o seu ciclo, o seu edital marcado, as suas revisões e o seu desempenho — e todos veem o placar, o feed e o progresso uns dos outros.</p></div></header>
  ${conexao()}
  <div class="cols">${ms.map(p=>{const st=G.stateOf(p.id)||G.peerState[p.id]; const s=st?G.summary(st):null;
    return `<section class="panel"><div class="row">${avatar(p)}<div><h2>${esc(p.completo||p.nome)}</h2>${p.resumo?`<div class="tiny faint">${esc(p.resumo)}</div>`:''}</div></div>
      ${s&&s.totalMin?`<div class="stats"><div class="stat"><span class="v">${G.hm(s.totalMin)}</span><span class="l">estudadas</span></div><div class="stat"><span class="v">${(s.prog*100).toFixed(0)}%</span><span class="l">do edital</span></div><div class="stat"><span class="v">${s.streak}</span><span class="l">dia(s) seguidos</span></div></div>`:'<p class="small muted">Sem registros neste aparelho por enquanto.</p>'}
      <div class="row"><button class="btn primary" data-act="perfil" data-arg="${p.id}">Entrar como ${esc(p.nome)}</button></div></section>`}).join('')}
    <section class="panel"><h2>${ms.length?'Novo participante':'Crie o seu perfil'}</h2><div class="field"><label for="np-nome">Seu nome</label><input type="text" id="np-nome" maxlength="40" autocomplete="off" placeholder="como quer aparecer no placar"></div><div class="row"><button class="btn${ms.length?'':' primary'}" data-act="perfil-novo">Criar perfil e entrar</button></div></section>
  </div>`;
};

/* ---------- peças do placar ---------- */
function diasSemana(st){
  const ws=G.weekStart(G.today()), set=new Set(st.sessoes.filter(s=>s.min>0||s.q>0).map(s=>s.d));
  return `<span class="days" role="img" aria-label="Dias estudados nesta semana">`+[0,1,2,3,4,5,6].map(i=>{const d=G.addDays(ws,i); return `<i class="${set.has(d)?'on':''}${d===G.today()?' hoje':''}" data-tip="${DIA3[G.pd(d).getDay()]} ${G.fmtShort(d)}${set.has(d)?' · estudou':''}"></i>`}).join('')+`</span>`;
}
function ranking(k,compacto){
  const pl=G.placar(k), mx=Math.max(1,...pl.map(r=>r.pts));
  return pl.map((r,i)=>r.st?`<div class="rank"><span class="pos">${i+1}º</span><div style="min-width:0"><div class="row">${avatar(r.m)}<button class="linkbtn" data-act="membro" data-arg="${r.m.id}">${esc(r.m.nome)}</button>${r.m.id===G.pid()?'<span class="chip">você</span>':''}${r.streak>=2?`<span class="chip"><b>${r.streak}</b> dias seguidos</span>`:''}</div>
      ${compacto?'':`<div class="small muted" style="margin-top:4px">${G.hm(r.min)} · ${r.q} questões${r.q?' ('+G.pct(r.ok,r.q)+'%)':''} · ${r.rev} revisão(ões) · ${r.dias.size} dia(s) ativos${r.sim?' · '+r.sim+' simulado(s)':''}</div>`}
      <div class="prog" style="margin-top:7px" aria-hidden="true"><i style="width:${(r.pts/mx*100).toFixed(0)}%"></i></div></div><span class="pts">${r.pts}<span class="tiny faint"> pts</span></span></div>`
    :`<div class="rank"><span class="pos">–</span><div class="row">${avatar(r.m)}<span>${esc(r.m.nome)}</span><span class="small faint">ainda sem dados sincronizados</span></div><span></span></div>`).join('');
}
G.miniPlacar=function(){
  return `<section class="panel"><div class="panel-head"><h2>Placar da semana</h2><button class="btn sm ghost" data-act="go" data-arg="grupo">Feed e placar completo</button></div>${ranking('semana',true)}</section>`;
};

/* ---------- GRUPO ---------- */
function feedItem(it){
  const m=G.member(it.by)||{nome:'Alguém'}, d=G.pd(it.d), quando=(it.d===G.today()?'hoje':DIA3[d.getDay()]+' '+G.fmtShort(it.d));
  const rs=G.social.reacoes[it.id]||{}, cs=Object.entries(G.social.comentarios[it.id]||{}).map(([id,c])=>c).filter(c=>c&&c.text).sort((a,b)=>(a.at||0)-(b.at||0));
  let corpo='';
  if(it.tipo==='sessao'){const s=it.s, dd=byId[s.disc];
    corpo=`${dot(dd?dd.bloco:1)} <b>${esc(dd?dd.nome:s.disc)}</b> · ${G.hm(s.min)} de ${esc(TIPO[s.tipo]||s.tipo)}${s.q?` · ${s.ok}/${s.q} questões (${G.pct(s.ok,s.q)}%)`:''}${s.nota?`<div class="small muted">“${esc(s.nota)}”</div>`:''}`}
  else {const x=it.x, en=x.tipo==='enam', t=en?x.total:(x.b1+x.b2+x.b3); corpo=`<b>Simulado ${en?'ENAM':'TJSC'}</b> · ${esc(x.nome)} · <span class="num">${t}/${en?80:100}</span>`}
  return `<div class="fi"><div class="fi-h">${avatar(m)}<b>${esc(m.nome)}</b><span class="small faint">${quando}</span></div><div>${corpo}</div>
    <div class="reac">${EMOJIS.map(e=>{const n=Object.values(rs).filter(v=>v===e).length; return `<button class="em" data-act="reagir" data-arg="${it.id}|${e}" aria-pressed="${rs[G.pid()]===e}" aria-label="Reagir com ${e}">${e}${n?`<span class="num">${n}</span>`:''}</button>`}).join('')}<button class="btn sm ghost" data-act="coment" data-arg="${it.id}">Comentar</button></div>
    ${cs.map(c=>`<div class="cmt"><b>${esc(nomeDe(c.by))}</b> ${esc(c.text)}</div>`).join('')}</div>`;
}
V.grupo=function(){
  const ms=G.members(), per=G.periodo(ui.periodo), feed=G.feed(40), P=F.PONTOS;
  const metas=ms.map(m=>{const st=G.stateOf(m.id); if(!st) return ''; const w=G.weekStats(null,st), mq=st.cfg.metaQ||100;
    return `<div class="stack" style="gap:8px"><div class="spread"><div class="row">${avatar(m)}<b>${esc(m.nome)}</b></div>${diasSemana(st)}</div>
      <div class="bars">${bar('Horas',w.min,w.meta,'',G.hm(w.min)+' / '+G.hm(w.meta),'Meta semanal de horas líquidas')}${bar('Questões',w.q,mq,'b2',w.q+' / '+mq,'Meta semanal de questões de prova')}</div></div>`}).join('');
  const sync=G.backend.kind==='local'?'só neste aparelho':G.backend.on?'sincronizado'+(G.backend.last?' às '+new Date(G.backend.last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''):'sem conexão agora';
  return `
  <header class="page-head"><div><div class="eyebrow">Grupo · ${ms.length} participante(s) · ${sync}</div><h1>Placar e feed</h1><p>Cada registro de estudo vira um check-in aqui. Pontos premiam o que aprova — hora líquida, questão de prova, revisão em dia e simulado — e qualquer um pode abrir o progresso completo do outro clicando no nome.</p></div>
    <div class="row"><button class="btn" data-act="grupo-atualizar">Atualizar</button><button class="btn primary" data-act="log" data-arg="|0">Fazer check-in</button></div></header>
  ${G.backend.kind==='local'&&!window.claude?G.conexaoHtml():''}
  <div class="cols wide-left">
    <section class="panel"><div class="panel-head"><h2>Placar · ${esc(per.nome)}</h2><div class="seg" role="group" aria-label="Período">${[['semana','Semana'],['mes','Mês'],['temporada','Temporada']].map(([k,l])=>`<button data-act="grupo-periodo" data-arg="${k}" aria-pressed="${ui.periodo===k}">${l}</button>`).join('')}</div></div>
      ${ranking(ui.periodo)}
      <p class="tiny faint">Pontuação: 1 ponto a cada ${P.minutos} min líquidos · 1 a cada ${P.questoes} questões de prova · ${P.revisao} por revisão espaçada concluída · ${P.simulado} por simulado. ${esc(F.TEMPORADA.nome)}: ${G.fmtShort(F.TEMPORADA.de)} a ${G.fmtShort(F.TEMPORADA.ate)}.</p></section>
    <section class="panel"><div class="panel-head"><h2>Metas da semana</h2><span class="small muted">quadradinhos = dias estudados</span></div>${metas||'<p class="small muted">Sem dados ainda.</p>'}</section>
  </div>
  <section class="panel"><div class="panel-head"><h2>Feed</h2><span class="small muted">últimos 21 dias</span></div>
    <div>${feed.map(feedItem).join('')||'<p class="small muted">Nenhum check-in ainda. Conclua um bloco na aba Hoje ou toque em “Fazer check-in” — ele aparece aqui para o grupo.</p>'}</div></section>`;
};

/* ---------- PROGRESSO INDIVIDUAL ---------- */
V.membro=function(){
  const m=G.member(ui.membro), st=m&&G.stateOf(m.id);
  if(!m||!st) return `<header class="page-head"><div><h1>Progresso</h1><p>Ainda não há dados sincronizados desta pessoa.</p></div><div class="row"><button class="btn" data-act="go" data-arg="grupo">Voltar ao grupo</button></div></header>`;
  const s=G.summary(st), acc=G.accByDisc(st), pe=G.projectionEnam(st), meta=st.cfg.meta||80, aj=G.ajDate(st);
  const ult=st.sessoes.slice().sort((a,b)=>a.d!==b.d?(a.d<b.d?1:-1):(a.id<b.id?1:-1)).slice(0,12);
  const dias=[]; for(let i=13;i>=0;i--){const d=G.addDays(G.today(),-i); dias.push({d,min:st.sessoes.filter(x=>x.d===d).reduce((t,x)=>t+x.min,0)})}
  const mx=Math.max(st.cfg.horas*60,...dias.map(x=>x.min));
  return `
  <header class="page-head"><div><div class="eyebrow">Progresso individual${m.id===G.pid()?' · você':' · somente leitura'}</div><h1>${esc(m.completo||m.nome)}</h1><p>${esc(m.resumo||'')} ${st.cfg.enam==='sim'?'ENAM: habilitado.':st.cfg.enam==='inscrito'?'ENAM: inscrito no 2026.2.':'ENAM: ainda sem certificado.'} ${st.cfg.aj==='sim'?'Atividade jurídica: 3 anos comprováveis.':aj?'Atividade jurídica: fecha 3 anos a partir de '+G.fmt(aj)+'.':'Atividade jurídica: em construção.'}</p></div>
    <div class="row"><button class="btn" data-act="go" data-arg="grupo">Voltar ao grupo</button></div></header>
  <div class="stats"><div class="stat"><span class="v">${G.hm(s.semMin)}</span><span class="l">nesta semana · meta ${G.hm(s.semMeta)}</span></div><div class="stat"><span class="v">${G.hm(s.totalMin)}</span><span class="l">no total</span></div><div class="stat"><span class="v">${s.q?G.pct(s.ok,s.q)+'%':'—'}</span><span class="l">acerto em ${s.q} questões</span></div><div class="stat"><span class="v">${(s.prog*100).toFixed(0)}%</span><span class="l">do edital</span></div><div class="stat"><span class="v">${s.q>=20?pe.total.toFixed(0)+'/80':'—'}</span><span class="l">projeção no ENAM</span></div><div class="stat"><span class="v">${s.streak}</span><span class="l">dia(s) seguidos</span></div></div>
  <div class="cols">
    <section class="panel"><div class="panel-head"><h2>Últimos 14 dias</h2><span class="small muted">traço = meta de ${st.cfg.horas} h</span></div><div class="bars">${dias.map(x=>bar(DIA3[G.pd(x.d).getDay()]+' '+G.fmtShort(x.d),x.min,mx,'',x.min?G.hm(x.min):'—',G.fmt(x.d)+': '+G.hm(x.min),st.cfg.horas*60)).join('')}</div></section>
    <section class="panel"><div class="panel-head"><h2>Acerto por disciplina</h2><span class="small muted">traço = meta (${meta}%)</span></div><div class="bars">${DISC.map(d=>{const x=acc[d.id], p=x.q?x.ok/x.q*100:0; return bar(dot(d.bloco)+' '+esc(d.short),p,100,'b'+d.bloco,x.q?p.toFixed(0)+'% <span class="faint">('+x.q+')</span>':'—',d.nome+': '+x.ok+'/'+x.q+' questões · '+G.hm(x.min),meta)}).join('')}</div></section>
  </div>
  <div class="cols">
    <section class="panel"><div class="panel-head"><h2>Edital por disciplina</h2></div><div class="bars">${G.EDITAL.map(e=>{const p=G.discProgress(e,st)*100; return bar(dot(e.disc.bloco)+' '+esc(e.disc.short),p,100,'b'+e.disc.bloco,p.toFixed(0)+'%',e.disc.nome+': '+e.unidades.filter(u=>G.unitState(u.key,st).t).length+' de '+e.unidades.length+' unidades com teoria revisada')}).join('')}</div></section>
    <section class="panel"><div class="panel-head"><h2>Últimos check-ins</h2></div>${ult.length?`<div class="tbl-wrap"><table class="data"><thead><tr><th>Data</th><th>Disciplina</th><th>Atividade</th><th class="n">Tempo</th><th class="n">Questões</th></tr></thead><tbody>${ult.map(x=>`<tr><td class="num">${G.fmtShort(x.d)}</td><td>${esc(byId[x.disc]?byId[x.disc].short:x.disc)}</td><td>${esc(TIPO[x.tipo]||x.tipo)}</td><td class="n">${G.hm(x.min)}</td><td class="n">${x.q?x.ok+'/'+x.q:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Sem registros ainda.</p>'}
      ${st.simulados.length?`<div class="eyebrow">Simulados</div><div class="row">${st.simulados.slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,8).map(x=>{const en=x.tipo==='enam',t=en?x.total:x.b1+x.b2+x.b3;return `<span class="chip">${G.fmtShort(x.d)} · ${en?'ENAM':'TJSC'} <b>${t}/${en?80:100}</b></span>`}).join('')}</div>`:''}</section>
  </div>`;
};

/* ---------- ações do grupo ---------- */
G.extraActions={
  membro(id){ui.membro=id;ui.route='membro';G.render();window.scrollTo(0,0)},
  'grupo-periodo'(k){ui.periodo=k;G.render()},
  reagir(a){const [id,e]=a.split('|');G.react(id,e);G.render()},
  coment(id){G.dlg('Comentar o check-in',`<div class="field"><label for="cm-t">Seu comentário</label><textarea id="cm-t" name="t" maxlength="280" required style="min-height:90px" placeholder="Boa! Amanhã me explica esse ponto na sabatina."></textarea></div>`,fd=>{G.comment(id,fd.t)},'Publicar')},
  async 'grupo-atualizar'(){await G.refresh(); G.render(); G.toast(G.backend.on?'Grupo atualizado':'Sem conexão com o grupo agora')},
  async 'grupo-criar'(){const el=$('#gp-url'); try{await G.connectGroup(el?el.value:''); G.render(); G.toast('Grupo criado — copie o convite e envie')}catch(e){G.toast(e.message||'Não foi possível criar o grupo')}},
  async 'grupo-entrar'(){const el=$('#gp-conv'); try{await G.joinByCode(el?el.value:''); G.render(); G.toast('Você entrou no grupo')}catch(e){G.toast(e.message||'Convite inválido')}},
  'grupo-sair'(){G.dlg('Desconectar este aparelho?','<p>O progresso já sincronizado continua no banco do grupo. Este aparelho passa a salvar só localmente até você entrar de novo com o convite.</p>',()=>{G.leaveGroup()},'Desconectar')},
  async copiar(id){const el=$('#'+id); if(!el)return; el.focus(); el.select(); try{await navigator.clipboard.writeText(el.value); G.toast('Convite copiado')}catch(e){try{document.execCommand('copy');G.toast('Convite copiado')}catch(_){G.toast('Selecione e copie manualmente')}}},
  async 'perfil-novo'(){const el=$('#np-nome'); try{const id=G.addMember(el?el.value:''); await G.switchProfile(id); G.toast('Perfil criado')}catch(e){G.toast(e.message||'Informe um nome')}}
};
})();
</script>
<script>
/* ===================== Gabinete · questões (etapa 1: provas reais com gabarito oficial) ===================== */
(function(){
'use strict';
const G=window.G, F=window.GAB_FACTS, {$,esc,DISC,byId,bar,dot}=G, S=G.S, ui=G.ui, V=G.views;
const L='ABCDE', BLN={1:'I',2:'II',3:'III'};
ui.prova='';
const provaDe=id=>F.PROVAS_REAIS.find(p=>p.id===id)||null;
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function veredito(p,r){
  if(p.fam==='enam') return r.ok>=62?['good','habilitaria com folga']:r.ok>=F.ENAM.minimo?['warn','habilitaria no limite']:['crit','abaixo dos 56 acertos'];
  const M=F.PROVA.minimos, okMin=r.blocos[1]>=M[1]&&r.blocos[2]>=M[2]&&r.blocos[3]>=M[3]&&r.ok>=F.PROVA.total;
  if(!okMin) return ['crit','eliminado nos mínimos'];
  return r.ok>=p.corte?['good','entre os convocados daquele ano']:['warn','habilitado, mas abaixo do corte de '+p.corte];
}

/* ---------- lista de provas ---------- */
function lista(){
  const card=p=>{const st=S.provas[p.id]||{}, n=G.provaQs(p).length, feitas=(st.resp||'').replace(/-/g,'').length;
    let pill='<span class="pill info">não iniciada</span>';
    if(st.corrigida){const v=veredito(p,G.corrigirProva(p,G.provaResp(p))); pill=`<span class="pill ${v[0]}">${st.ok}/${st.n} · ${v[1]}</span>`}
    else if(feitas) pill=`<span class="pill warn">em andamento · ${feitas}/${n}</span>`;
    return `<section class="panel"><div class="panel-head"><h3 style="font-family:var(--f-display);font-size:1.05rem">${esc(p.nome)}</h3>${pill}</div>
      <p class="small muted">${n} questões · aplicada em ${esc(p.data)}. ${esc(p.nota||'')}</p>
      <div class="row"><button class="btn primary sm" data-act="pr-abrir" data-arg="${p.id}">${st.corrigida?'Ver correção':feitas?'Continuar':'Abrir folha de respostas'}</button><a class="btn sm" href="${esc(p.pdf)}" target="_blank" rel="noopener">Caderno Tipo 1 (PDF)</a></div></section>`};
  const enam=F.PROVAS_REAIS.filter(p=>p.fam==='enam'&&G.provaQs(p).length), tjsc=F.PROVAS_REAIS.filter(p=>p.fam==='tjsc'&&G.provaQs(p).length);
  return `
  <header class="page-head"><div><div class="eyebrow">Questões · provas reais da FGV</div><h1>Provas reais com gabarito oficial</h1><p>Abra o caderno oficial (sempre o <b>Tipo 1</b>), resolva como no dia da prova e marque as respostas aqui. A plataforma corrige pelo gabarito definitivo, dá a nota por disciplina, mostra o capítulo de cada erro e alimenta a projeção de nota e o placar. Os enunciados ficam no PDF oficial — não são copiados para cá.</p></div></header>
  <div class="alert calm"><span class="mark">a seguir</span><div><b>Bateria por unidade, flashcards e lacunas de lei seca</b><span class="small">Chegam nas próximas etapas, gerados a partir dos PDFs de vocês e entregues pelo banco do grupo. As provas reais abaixo já funcionam, inclusive sem internet depois de baixar o PDF.</span></div></div>
  <div class="eyebrow">ENAM · 80 questões · habilita com 56 · <b>o alvo</b></div><div class="cols">${enam.map(card).join('')}</div>
  <div class="eyebrow" style="margin-top:6px">Magistratura estadual · mesma banca, como treino extra</div>
  <p class="small muted" style="margin:-6px 0 0">As provas do TJSC não são mais alvo — o concurso de 2026/27 foi descartado. Ficam aqui porque a banca é a FGV e o estilo é o mesmo: servem para treinar leitura de enunciado, não para medir sua nota no ENAM.</p>
  <div class="cols">${tjsc.map(card).join('')}</div>`;
}

/* ---------- folha de respostas ---------- */
function resultado(p,r){
  const v=veredito(p,r), tot=p.fam==='enam'?80:100, M=F.PROVA.minimos;
  const porDisc=DISC.filter(d=>r.porDisc[d.id]).map(d=>{const x=r.porDisc[d.id]; return bar(dot(d.bloco)+' '+esc(d.short),x.ok,x.n,'b'+d.bloco,x.ok+'/'+x.n,d.nome+': '+x.ok+' de '+x.n+' ('+G.pct(x.ok,x.n)+'%)')}).join('');
  const caps={}; r.erros.forEach(e=>{const k=byId[e.disc].short+' · '+e.macro; caps[k]=(caps[k]||0)+1});
  const topCaps=Object.entries(caps).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return `<section class="panel" style="border-color:var(--primary)"><div class="panel-head"><h2>Resultado</h2><span class="pill ${v[0]}">${v[1]}</span></div>
    <div class="stats"><div class="stat"><span class="v">${r.ok}/${tot}</span><span class="l">acertos${r.anul?' (inclui '+r.anul+' anulada'+(r.anul>1?'s':'')+')':''}</span></div><div class="stat"><span class="v">${r.erros.length-r.brancos}</span><span class="l">erradas</span></div><div class="stat"><span class="v">${r.brancos}</span><span class="l">em branco</span></div>${p.fam==='tjsc'?[1,2,3].map(b=>`<div class="stat"><span class="v">${r.blocos[b]}</span><span class="l">Bloco ${BLN[b]} · mínimo ${M[b]}</span></div>`).join(''):''}</div>
    <div class="cols"><div><div class="eyebrow" style="margin-bottom:8px">Acertos por disciplina</div><div class="bars">${porDisc}</div></div>
      <div><div class="eyebrow" style="margin-bottom:8px">Onde os erros se concentram</div>${topCaps.length?`<div class="row">${topCaps.map(([k,n])=>`<span class="chip">${esc(k)} <b>${n}</b></span>`).join('')}</div>`:'<p class="small muted">Nenhum erro. Gabaritou.</p>'}
        <p class="small muted" style="margin-top:10px">O resultado já entrou em Desempenho (projeção de nota e acerto por disciplina), nos simulados e no placar do grupo.</p></div></div>
    ${r.erros.length?`<div class="tbl-wrap scroll-y"><table class="data"><thead><tr><th class="n">Nº</th><th>Disciplina</th><th>Capítulo</th><th>Tema cobrado</th><th>Marquei</th><th>Gabarito</th></tr></thead><tbody>${r.erros.map(e=>`<tr><td class="n">${e.q}</td><td>${dot(byId[e.disc].bloco)} ${esc(byId[e.disc].short)}</td><td>${esc(e.macro)}</td><td>${esc(e.tema)}</td><td class="num">${e.marcou==='-'?'—':e.marcou}</td><td class="num"><b>${e.gab}</b></td></tr>`).join('')}</tbody></table></div>`:''}
    <div class="row">${r.erros.length?`<button class="btn" data-act="pr-erros" data-arg="${p.id}">Mandar os erros para o caderno de erros</button>`:''}<a class="btn" href="${esc(p.gab)}" target="_blank" rel="noopener">Gabarito oficial (PDF)</a><button class="btn danger" data-act="pr-refazer" data-arg="${p.id}">Refazer esta prova</button></div></section>`;
}
function folha(p){
  const qs=G.provaQs(p), st=S.provas[p.id]||{}, resp=G.provaResp(p), key=G.GABS[p.id]||'', corr=!!st.corrigida, feitas=resp.replace(/-/g,'').length;
  const r=corr?G.corrigirProva(p,resp):null;
  const secs=[]; qs.forEach(q=>{const u=secs[secs.length-1]; if(u&&u.disc===q.disc) u.qs.push(q); else secs.push({disc:q.disc,qs:[q]})});
  const linha=q=>{const m=resp[q.q-1], k=key[q.q-1];
    return `<div class="fr" data-q="${q.q}"><span class="qn">${q.q}</span>${L.split('').map(l=>{let c=''; if(corr){if(k===l)c='k'; if(m===l)c+=(k===l||k==='X')?' c':' x'}
      return `<button class="${c.trim()}" data-act="pr-marca" data-arg="${p.id}|${q.q}|${l}" aria-pressed="${m===l}" ${corr?'disabled':''} aria-label="Questão ${q.q}, alternativa ${l}">${l}</button>`}).join('')}<span class="st">${corr&&k==='X'?'anulada':''}</span></div>`};
  return `
  <header class="page-head"><div><div class="eyebrow">Folha de respostas · ${esc(p.data)}</div><h1>${esc(p.nome)}</h1><p>Use o caderno <b>Tipo 1</b>: a ordem das questões muda entre os tipos e o gabarito embutido é o do Tipo 1. Suas marcações ficam salvas — dá para parar e continuar depois.</p></div>
    <div class="row"><button class="btn" data-act="pr-voltar">Todas as provas</button><a class="btn primary" href="${esc(p.pdf)}" target="_blank" rel="noopener">Abrir caderno Tipo 1 (PDF)</a></div></header>
  ${corr?resultado(p,r):`<section class="panel"><div class="spread"><div class="row"><span class="chip">respondidas <b id="pr-count">${feitas}</b>/${qs.length}</span><span class="chip">tempo <b id="pr-clock" data-ini="${st.inicio||''}">${st.inicio?clock(Date.now()-st.inicio):'—'}</b></span></div>
      <div class="row">${st.inicio?'':`<button class="btn sm" data-act="pr-crono" data-arg="${p.id}">Iniciar cronômetro (prova real: 5 h)</button>`}<button class="btn sm primary" data-act="pr-corrigir" data-arg="${p.id}">Corrigir prova</button></div></div>
      <span class="tiny faint">Meta de ritmo: ${p.fam==='enam'?'3 min 45 s':'3 min'} por questão. Sem desconto por erro — na prova, nunca deixe em branco.</span></section>`}
  ${secs.map(s=>`<section class="panel"><div class="panel-head"><h3>${dot(byId[s.disc].bloco)} ${esc(byId[s.disc].nome)}</h3><span class="small muted num">questões ${s.qs[0].q}–${s.qs[s.qs.length-1].q}${corr?' · '+r.porDisc[s.disc].ok+'/'+r.porDisc[s.disc].n:''}</span></div><div class="sheet">${s.qs.map(linha).join('')}</div></section>`).join('')}
  ${corr?'':`<div class="row"><button class="btn primary" data-act="pr-corrigir" data-arg="${p.id}">Corrigir prova</button><button class="btn danger" data-act="pr-refazer" data-arg="${p.id}">Apagar marcações</button></div>`}`;
}
V.questoes=function(){const p=provaDe(ui.prova); return p&&G.provaQs(p).length?folha(p):lista()};
setInterval(()=>{const c=$('#pr-clock'); if(c&&c.dataset.ini) c.textContent=clock(Date.now()-(+c.dataset.ini))},1000);

/* ---------- ações ---------- */
Object.assign(G.extraActions=G.extraActions||{},{
  'pr-abrir'(id){ui.prova=id;ui.route='questoes';G.render();window.scrollTo(0,0)},
  'pr-voltar'(){ui.prova='';G.render();window.scrollTo(0,0)},
  'pr-marca'(a,btn){const [id,q,l]=a.split('|'), p=provaDe(id); if(!p)return; G.marcarProva(p,+q,l);
    const resp=G.provaResp(p), row=btn.closest('.fr'); if(row) row.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===resp[+q-1])));
    const c=$('#pr-count'); if(c) c.textContent=resp.replace(/-/g,'').length},
  'pr-crono'(id){const o=S.provas[id]=S.provas[id]||{}; if(!o.inicio){o.inicio=Date.now();G.touch('provas')} G.render()},
  'pr-corrigir'(id){const p=provaDe(id); if(!p)return; const st=S.provas[id]||{}, resp=G.provaResp(p), n=resp.length, br=(resp.match(/-/g)||[]).length;
    if(br===n){G.toast('Marque as respostas antes de corrigir');return}
    const sug=st.inicio?Math.min(600,Math.max(1,Math.round((Date.now()-st.inicio)/60000))):'';
    G.dlg('Corrigir '+esc(p.nome),`${br?`<div class="alert gold"><span class="mark">${br}</span><div><b>${br} questão(ões) em branco</b><span class="small">Elas contam como erro. Depois de corrigir, a folha fica travada (dá para refazer do zero).</span></div></div>`:'<p class="small muted">Depois de corrigir, a folha fica travada (dá para refazer do zero).</p>'}
      <div class="field"><label for="pr-min">Quanto tempo você levou, em minutos? (entra nas suas horas de estudo)</label><input type="number" id="pr-min" name="min" min="0" max="600" value="${sug}" placeholder="ex.: 270"></div>`,
      fd=>{const r=G.salvarProva(p,fd.min); G.toast('Corrigida: '+r.ok+'/'+r.n)},'Corrigir agora')},
  'pr-refazer'(id){const p=provaDe(id); if(!p)return; G.dlg('Refazer '+esc(p.nome)+'?','<p>Apaga as marcações e o resultado desta prova (inclusive do desempenho, dos simulados e do placar). Os erros já enviados ao caderno de erros continuam lá.</p>',()=>{G.refazerProva(p)},'Apagar e refazer')},
  'pr-erros'(id){const p=provaDe(id); if(!p)return; const n=G.errosParaCaderno(p); G.toast(n?n+' erro(s) no caderno — escreva a regra correta de cada um em Revisões':'Esses erros já estavam no caderno')}
});
})();
</script>
<script>
/* ===================== Gabinete · telas (2/2), ações e boot ===================== */
(function(){
'use strict';
const G=window.G, F=window.GAB_FACTS, {$,$$,esc,DISC,byId,bar,dot,discOpts,BL}=G, S=G.S, ui=G.ui, V=G.views;
const TIPOS=[['misto','Misto (teoria + questões)'],['teoria','Teoria'],['questoes','Questões de prova'],['lei','Lei seca'],['juris','Jurisprudência / informativos'],['revisao','Revisão'],['simulado','Simulado'],['discursiva','Discursiva / sentença'],['quiz-ia','Quiz com IA']];
const tipoLabel=Object.fromEntries(TIPOS);

/* ---------- DESEMPENHO ---------- */
V.desempenho=function(){
  const acc=G.accByDisc(), pr=G.projection(), P=F.PROVA, meta=S.cfg.meta;
  const tq=DISC.reduce((t,d)=>t+acc[d.id].q,0), tok=DISC.reduce((t,d)=>t+acc[d.id].ok,0), tmin=S.sessoes.reduce((t,s)=>t+s.min,0);
  const okB=b=>pr.blocos[b].proj>=P.minimos[b];
  const proj=[1,2,3].map(b=>bar('Bloco '+BL[b],pr.blocos[b].proj,P.blocosQ[b],'b'+b,pr.blocos[b].proj.toFixed(1)+'/'+P.blocosQ[b],'Projeção de acertos no Bloco '+BL[b]+' · mínimo eliminatório: '+P.minimos[b],P.minimos[b])).join('')
    +bar('<b>Total</b>',pr.total,100,'',pr.total.toFixed(1)+'/100','Projeção total · mínimo 60 · veja a nota de corte de referência abaixo',P.total);
  const discBars=DISC.map(d=>{const x=acc[d.id]; const p=x.q?x.ok/x.q*100:0;
    return bar(dot(d.bloco)+' '+esc(d.short),p,100,'b'+d.bloco,x.q?p.toFixed(0)+'% <span class="faint">('+x.q+')</span>':'—',d.nome+': '+x.ok+'/'+x.q+' questões · '+G.hm(x.min)+' estudadas',meta)}).join('');
  const fracas=DISC.filter(d=>acc[d.id].q>=10).sort((a,b)=>acc[a.id].ok/acc[a.id].q-acc[b.id].ok/acc[b.id].q).slice(0,3);
  const pe=G.projectionEnam(), E=F.ENAM;
  const enamPanel=`<section class="panel"><div class="panel-head"><h2>Projeção de nota no ENAM</h2>${pe.semDados>1?`<span class="pill warn">${pe.semDados} questões sem dados seus</span>`:`<span class="pill ${pe.total>=62?'good':pe.total>=E.minimo?'warn':'crit'}">${pe.total>=62?'com folga':pe.total>=E.minimo?'no limite':'abaixo de 56'}</span>`}</div>
      <div class="bars">${pe.linhas.map(l=>bar(dot(l.d.bloco)+' '+esc(l.d.short),l.pts,16,'b'+l.d.bloco,l.tem?l.pts.toFixed(1)+'/'+l.d.enam:'<span class="faint">?/'+l.d.enam+'</span>',l.d.nome+': '+(l.tem?Math.round(l.p*100)+'% de acerto × '+l.d.enam+' questões':'menos de 6 questões registradas — presumido 50%'),l.d.enam)).join('')}${bar('<b>Total</b>',pe.total,80,'',pe.total.toFixed(1)+'/80','Projeção total no ENAM · habilita com 56',E.minimo)}</div>
      <span class="tiny faint">Traço = teto de cada disciplina; no total, o traço é o mínimo de 56 acertos. Mire 62 ou mais: a dificuldade varia muito entre edições.</span></section>`;
  const sims=S.simulados.slice().sort((a,b)=>a.d<b.d?1:-1);
  const simRow=s=>{const en=s.tipo==='enam', t=en?s.total:s.b1+s.b2+s.b3, ok=en?t>=E.minimo:(s.b1>=12&&s.b2>=9&&s.b3>=9&&t>=60);
    const cls=en?(t>=62?'good':t>=E.minimo?'warn':'crit'):(ok?(t>=P.corteNum?'good':'warn'):'crit'), txt=en?(t>=62?'habilitado com folga':t>=E.minimo?'habilitado no limite':'abaixo de 56'):(ok?(t>=P.corteNum?'na zona de corte':'habilitado, abaixo do corte'):'eliminado nos mínimos');
    return `<tr><td class="num">${G.fmtShort(s.d)}</td><td>${esc(s.nome)}</td><td>${en?'ENAM':'TJSC'}</td><td class="n">${en?'—':s.b1}</td><td class="n">${en?'—':s.b2}</td><td class="n">${en?'—':s.b3}</td><td class="n"><b>${t}</b>/${en?80:100}</td><td><span class="pill ${cls}">${txt}</span></td><td><button class="btn sm ghost danger" data-act="sim-del" data-arg="${s.id}" aria-label="Excluir simulado">×</button></td></tr>`};
  const ses=S.sessoes.slice().sort((a,b)=>a.d<b.d?1:(a.d>b.d?-1:0)).slice(0,25);
  return `
  <header class="page-head"><div><div class="eyebrow">Desempenho</div><h1>Onde você está em relação à prova</h1><p>A projeção multiplica seu percentual de acerto em cada disciplina pelo número de questões que ela costuma render no TJSC. Disciplinas com menos de 6 questões registradas entram com 50% presumidos; com poucas questões o número oscila bastante — ele firma conforme você registra mais.</p></div>
    <div class="row"><button class="btn" data-act="log" data-arg="|0">Registrar estudo</button><button class="btn" data-act="sim-add" data-arg="enam">Registrar treino do ENAM</button>${S.cfg.enam==='sim'?'<button class="btn" data-act="sim-add" data-arg="tjsc">Treino de magistratura</button>':''}</div></header>
  <div class="stats"><div class="stat"><span class="v">${G.hm(tmin)}</span><span class="l">estudadas no total</span></div><div class="stat"><span class="v">${tq}</span><span class="l">questões de prova registradas</span></div><div class="stat"><span class="v">${tq?G.pct(tok,tq)+'%':'—'}</span><span class="l">acerto geral · meta ${meta}%</span></div><div class="stat"><span class="v">${(G.overallProgress()*100).toFixed(0)}%</span><span class="l">do edital coberto</span></div></div>
  <div class="cols">
    ${S.cfg.enam!=='sim'?enamPanel:''}
    ${S.cfg.enam==='sim'?`<section class="panel"><div class="panel-head"><h2>Projeção numa objetiva de magistratura</h2>${pr.semDados>1?`<span class="pill warn">${pr.semDados.toFixed(0)} questões sem dados seus</span>`:''}</div>
      <div class="bars">${proj}</div><span class="tiny faint">Régua do TJSC (100 questões, mínimos 12 · 9 · 9 · 60), usada como referência de prova de magistratura estadual com banca FGV.</span>
      <div class="row">${[1,2,3].map(b=>`<span class="pill ${okB(b)?'good':'crit'}">Bloco ${BL[b]}: ${okB(b)?'acima do mínimo':'abaixo do mínimo'}</span>`).join('')}</div>
      <p class="small muted">${esc(P.corteRef)}</p></section>`:''}
    <section class="panel"><div class="panel-head"><h2>Acerto por disciplina</h2><span class="small muted">traço = sua meta (${meta}%)</span></div>
      <div class="bars">${discBars}</div>
      ${fracas.length?`<p class="small"><b>Prioridade de reforço:</b> ${fracas.map(d=>esc(d.short)+' ('+G.pct(acc[d.id].ok,acc[d.id].q)+'%)').join(' · ')}. Marque essas disciplinas como “Fraco” em Ajustes para o ciclo dar mais blocos a elas.</p>`:'<p class="small muted">Registre ao menos 10 questões por disciplina para o diagnóstico aparecer.</p>'}</section>
  </div>
  <section class="panel"><div class="panel-head"><h2>Simulados</h2><span class="small muted">sempre 5 horas cronometradas, domingo à tarde, no horário da prova</span></div>
    ${sims.length?`<div class="tbl-wrap"><table class="data"><thead><tr><th>Data</th><th>Simulado</th><th>Tipo</th><th class="n">Bl. I /40</th><th class="n">Bl. II /30</th><th class="n">Bl. III /30</th><th class="n">Total</th><th>Situação</th><th></th></tr></thead><tbody>${sims.map(simRow).join('')}</tbody></table></div>`:'<p class="small muted">Nenhum simulado ainda. As cinco provas anteriores do ENAM e as três do TJSC, todas da FGV, são os melhores simulados que existem — os links estão no Raio-X.</p>'}</section>
  <section class="panel"><div class="panel-head"><h2>Últimos registros</h2></div>
    ${ses.length?`<div class="tbl-wrap"><table class="data"><thead><tr><th>Data</th><th>Disciplina</th><th>Atividade</th><th class="n">Tempo</th><th class="n">Questões</th><th>Nota</th><th></th></tr></thead><tbody>${ses.map(s=>`<tr><td class="num">${G.fmtShort(s.d)}</td><td>${dot(byId[s.disc]?byId[s.disc].bloco:1)} ${esc(byId[s.disc]?byId[s.disc].short:s.disc)}</td><td>${esc(tipoLabel[s.tipo]||s.tipo)}</td><td class="n">${G.hm(s.min)}</td><td class="n">${s.q?s.ok+'/'+s.q:'—'}</td><td class="small">${esc(s.nota||'')}</td><td><button class="btn sm ghost danger" data-act="ses-del" data-arg="${s.id}" aria-label="Excluir registro">×</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Sem registros. Conclua um bloco na aba Hoje ou use “Registrar estudo”.</p>'}</section>`;
};

/* ---------- REVISÕES ---------- */
V.revisoes=function(){
  const due=G.dueReviews(), up=G.upcomingReviews().slice(0,12), t=G.today();
  const item=(r,acts)=>`<div class="pi" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="t">${dot(byId[r.disc]?byId[r.disc].bloco:1)}${esc(r.titulo)}</div><div class="s">${esc(byId[r.disc]?byId[r.disc].nome:'')} · ${r.step+1}ª revisão (${G.INTERVALOS[r.step]} d) · ${r.due<t?'venceu há '+G.diff(t,r.due)+' d':r.due===t?'vence hoje':'em '+G.fmtShort(r.due)}</div></div><div class="acts row">${acts}</div></div>`;
  return `
  <header class="page-head"><div><div class="eyebrow">Memória de longo prazo</div><h1>Revisões e caderno de erros</h1><p>Cada unidade com teoria marcada volta em 1, 7, 30 e 90 dias. Revisar é <b>testar-se</b>: feche o material, responda de cabeça ou faça 10 questões do ponto, e só então confira. Reler grifos dá sensação de domínio sem retenção.</p></div>
    <div class="row"><button class="btn" data-act="rev-add">Agendar revisão avulsa</button><button class="btn" data-act="err-add">Anotar erro</button></div></header>
  <div class="cols">
    <section class="panel"><div class="panel-head"><h2>Para hoje</h2><span class="chip"><b>${due.length}</b></span></div><div class="pauta">${due.map(r=>item(r,`<button class="btn sm primary" data-act="rev-done" data-arg="${r.id}">Revisei</button><button class="btn sm ghost" data-act="rev-snooze" data-arg="${r.id}|2">+2 d</button>`)).join('')||'<p class="small muted">Nenhuma revisão vencida.</p>'}</div></section>
    <section class="panel"><div class="panel-head"><h2>Próximas</h2></div><div class="pauta">${up.map(r=>item(r,'')).join('')||'<p class="small muted">A fila se forma conforme você marca a teoria das unidades no Edital.</p>'}</div></section>
  </div>
  <section class="panel"><div class="panel-head"><h2>Caderno de erros</h2><span class="small muted">${S.erros.filter(e=>!e.ok).length} em aberto</span></div>
    <p class="small muted">Para cada questão errada, anote a regra correta em uma frase — não o enunciado. Releia o caderno inteiro na semana da prova.</p>
    ${S.erros.length?`<div class="tbl-wrap scroll-y"><table class="data"><thead><tr><th>Data</th><th>Disciplina</th><th>Tema</th><th>Regra correta</th><th></th></tr></thead><tbody>${S.erros.slice().reverse().map(e=>`<tr style="${e.ok?'opacity:.55':''}"><td class="num">${G.fmtShort(e.d)}</td><td>${esc(byId[e.disc]?byId[e.disc].short:'')}</td><td>${esc(e.tema)}</td><td>${esc(e.nota)}</td><td class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="err-toggle" data-arg="${e.id}">${e.ok?'Reabrir':'Dominado'}</button><button class="btn sm ghost danger" data-act="err-del" data-arg="${e.id}" aria-label="Excluir">×</button></td></tr>`).join('')}</tbody></table></div>`:''}</section>`;
};

const AI_ERR={rate_limited:'Limite de uso do Claude atingido agora. Tente de novo mais tarde.',refused:'O Claude recusou este pedido. Reformule o tema.',invalid_json:'A resposta veio fora do formato esperado. Gere novamente.',session_expired:'Sua sessão expirou — entre de novo no claude.ai.',empty_completion:'Resposta vazia. Tente um tema mais específico.',prompt_too_large:'Texto grande demais. Encurte a resposta.',upstream_error:'Falha de conexão com o Claude. Tente novamente.'};
const AI_OFF=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
async function aiCall(fn){
  if(!ui.ai||ui.aiBusy) return; ui.aiBusy=true; ui.aiNote=''; ui.aiCtl=new AbortController(); render();

}
