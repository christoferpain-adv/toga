<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D5C47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>window.GAB_BUILD="site"</script>
</head>
<body>
<title>Gabinete Magistratura SC</title>
<script>
/* tema: aplicado antes da primeira pintura. Fora do Claude o padrão é claro; dentro dele, segue o tema do próprio Claude. */
(function(){var t;try{t=localStorage.getItem('gabinete-tema')}catch(e){}
  if(!t) t=window.claude?'auto':'claro';
  if(t==='claro') document.documentElement.setAttribute('data-theme','light');
  else if(t==='escuro') document.documentElement.setAttribute('data-theme','dark');
  window.GAB_TEMA=t;})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEA; --ink:#13201A; --ink-2:#4C5F56; --ink-3:#74857C; --line:#D5DDD8;
  --primary:#1D5C47; --primary-ink:#FFFFFF; --primary-soft:#DCEBE4;
  --accent:#B4281F; --accent-soft:#F8E3E0;
  --gold:#8F6210; --gold-soft:#F5EBD6;
  --b1:#2a78d6; --b2:#eb6834; --b3:#1baf7a;
  --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-text:#006300;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 8px 24px rgba(19,32,26,.06);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --bg:#0E1512; --surface:#16201B; --surface-2:#1E2B25; --ink:#E7EEEA; --ink-2:#B3C2BA; --ink-3:#82938A; --line:#2A3831;
    --primary:#63C3A0; --primary-ink:#0B1712; --primary-soft:#1B382E;
    --accent:#FF8A7E; --accent-soft:#3B201D;
    --gold:#E2B45C; --gold-soft:#372D17;
    --b1:#3987e5; --b2:#d95926; --b3:#199e70;
    --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
    --good-text:#0ca30c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0E1512; --surface:#16201B; --surface-2:#1E2B25; --ink:#E7EEEA; --ink-2:#B3C2BA; --ink-3:#82938A; --line:#2A3831;
  --primary:#63C3A0; --primary-ink:#0B1712; --primary-soft:#1B382E;
  --accent:#FF8A7E; --accent-soft:#3B201D;
  --gold:#E2B45C; --gold-soft:#372D17;
  --b1:#3987e5; --b2:#d95926; --b3:#199e70;
  --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --good-text:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(1.55rem,1.2rem + 1.4vw,2.1rem);line-height:1.15}
h2{font-size:1.2rem;line-height:1.25}
h3{font-size:.95rem;font-weight:600}
a{color:var(--primary);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px 16px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1.18rem;font-weight:600;line-height:1.1}
.brand span{font-size:.74rem;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:7px;background:none;text-align:left;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.nav button.who{border:1px solid var(--line);margin-bottom:8px;color:var(--ink);background:var(--surface-2)}
.nav button.who b{font-family:var(--f-display);font-weight:600}
.nav .count{font:500 .72rem var(--f-mono);padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;padding:0 8px;display:flex;flex-direction:column;gap:6px}
.sync{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--ink-3)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.sync[data-s="cloud"] i{background:var(--good)} .sync[data-s="local"] i{background:var(--warn)} .sync[data-s="saving"] i{background:var(--b1)}
main{min-width:0;padding-block:28px 96px;padding-inline:clamp(16px,3.2vw,44px)}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.page-head p{max-width:64ch;color:var(--ink-2);margin-top:6px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;gap:10px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand span,.side-foot .tiny{display:none}
  .brand b{font-size:1rem;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;flex:1;scrollbar-width:none;gap:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;width:auto;padding:7px 10px}
  .side-foot{margin:0;padding:0}
  .sync span{display:none}
  main{padding-block:20px 110px}
}

/* ---------- blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));align-items:start}
.cols.wide-left{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
@media (max-width:1000px){.cols.wide-left{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.spread{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft)}
.alert.gold{border-color:var(--gold);background:var(--gold-soft)}
.alert.calm{border-color:var(--line);background:var(--surface-2)}
.alert b{display:block}
.alert .mark{font:600 .72rem var(--f-mono);padding:3px 7px;border-radius:5px;background:var(--accent);color:var(--surface);flex:none;margin-top:2px}
.alert.gold .mark{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .v{font:500 1.5rem/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--ink-2)}
.stat .d{font-size:.74rem;color:var(--ink-3)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.chip.on{background:var(--primary-soft);color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good-text)} .pill.warn{color:var(--gold)} .pill.crit{color:var(--accent)} .pill.info{color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block;background:var(--ink-3)}
.dot.b1{background:var(--b1)} .dot.b2{background:var(--b2)} .dot.b3{background:var(--b3)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- timeline rail ---------- */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:0;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ms{position:relative;padding:18px 14px 2px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.ms::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--line)}
.ms::after{content:"";position:absolute;top:1px;left:0;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3)}
.ms.past{opacity:.55} .ms.past::after{background:var(--ink-3)}
.ms.next::after{border-color:var(--accent);background:var(--accent)}
.ms.key::after{border-color:var(--primary)}
.ms .when{font:500 .78rem var(--f-mono);color:var(--ink-2)}
.ms .what{font-weight:600;font-size:.9rem;line-height:1.25}
.ms .dd{font:500 .78rem var(--f-mono);color:var(--ink-3)}
.ms.next .dd{color:var(--accent)}

/* ---------- pauta ---------- */
.pauta{display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.pi:first-child{border-top:0;padding-top:2px}
.pi .n{font:500 .85rem var(--f-mono);color:var(--ink-3);text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 0}
.pi .t{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pi .s{font-size:.84rem;color:var(--ink-2)}
.pi.done{opacity:.55} .pi.done .t{text-decoration:line-through}
@media (max-width:520px){.pi{grid-template-columns:28px minmax(0,1fr)} .pi .acts{grid-column:2}}

/* ---------- bars / tables ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.br{display:grid;grid-template-columns:minmax(96px,180px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.86rem}
.br .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.br .track{height:12px;position:relative;border-radius:0 4px 4px 0}
.br .fill{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;background:var(--primary);min-width:2px}
.br .fill.b1{background:var(--b1)} .br .fill.b2{background:var(--b2)} .br .fill.b3{background:var(--b3)}
.br .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.br .val{font:500 .8rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.2em;text-align:right}
.br[data-tip]{cursor:default} .br[data-tip]:hover .lab{color:var(--ink)}
.stackbar{display:flex;height:16px;gap:2px;border-radius:4px;overflow:hidden}
.stackbar i{display:block;min-width:2px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.data{width:100%;border-collapse:collapse;font-size:.86rem}
table.data th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
table.data td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data td.n,table.data th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inbar{display:inline-block;height:9px;border-radius:0 3px 3px 0;vertical-align:middle;margin-right:8px;min-width:2px}
.scroll-y{max-height:460px;overflow-y:auto}

/* ---------- edital ---------- */
.disc-list{display:flex;flex-direction:column;gap:10px}
details.disc{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.disc>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,200px) auto;gap:14px;align-items:center;padding:13px 18px}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary .nm{font-weight:600;display:flex;align-items:center;gap:9px;min-width:0}
details.disc[open]>summary{border-bottom:1px solid var(--line)}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:99px}
.disc-body{padding:12px 18px 16px;display:flex;flex-direction:column;gap:12px}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.unit:first-of-type{border-top:0}
.unit .ttl{font-size:.9rem}
.tg{display:inline-flex;gap:4px}
.tg button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:600 .74rem var(--f-mono);color:var(--ink-3)}
.tg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tg button.rev{width:auto;padding:0 8px;color:var(--gold);border-color:var(--gold-soft);background:var(--gold-soft)}
@media (max-width:620px){details.disc>summary{grid-template-columns:minmax(0,1fr) auto} details.disc>summary .prog{display:none} .unit{grid-template-columns:minmax(0,1fr)}}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:.86rem;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.lvl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-top:1px dashed var(--line);font-size:.9rem}
.lvl:first-child{border-top:0}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,18,14,.55)}
.dlg-body{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}

/* ---------- misc ---------- */
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg)}
.timerbar .clock{font:500 1.35rem var(--f-mono);font-variant-numeric:tabular-nums}
.timerbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.timerbar .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.35}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.prose{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.prose ul,.prose ol{margin:0;padding-left:1.15rem;display:flex;flex-direction:column;gap:6px}
.prose li::marker{color:var(--ink-3)}
.quiz-q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.quiz-q:first-child{border-top:0;padding-top:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--ink-3)}
.opt b{font-family:var(--f-mono);font-weight:500;color:var(--ink-3)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.bad{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,var(--surface))}
.ai-out{white-space:pre-wrap;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px 16px;font-size:.92rem}
.career{display:flex;flex-direction:column;gap:10px}
.career h3{font-family:var(--f-display);font-size:1.08rem}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
/* ---------- folha de respostas ---------- */
a.btn{text-decoration:none;color:var(--ink)} a.btn.primary{color:var(--primary-ink)}
.sheet{columns:2 300px;column-gap:32px}
.fr{display:grid;grid-template-columns:34px repeat(5,38px) minmax(0,1fr);gap:6px;align-items:center;padding:3px 0;break-inside:avoid}
.fr .qn{font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-3);text-align:right;padding-right:4px}
.fr button{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:600 .85rem var(--f-mono);color:var(--ink-2)}
.fr button:hover:not(:disabled){border-color:var(--ink-3)}
.fr button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fr button:disabled{cursor:default}
.fr button.k{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good);color:var(--good-text)}
.fr button.c[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.fr button.x[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.fr .st{font-size:.76rem;color:var(--ink-3)}
/* ---------- grupo ---------- */
.avatar{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font:600 .82rem var(--f-ui);background:var(--primary-soft);color:var(--primary);flex:none}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px}
.linkbtn:hover{color:var(--primary)}
.rank{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0;padding-top:2px}
.rank .pos{font:500 1rem var(--f-mono);color:var(--ink-3);text-align:center}
.rank .pts{font:500 1.3rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.days{display:inline-flex;gap:4px}
.days i{display:block;width:15px;height:15px;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.days i.on{background:var(--primary);border-color:var(--primary)}
.days i.hoje{outline:2px solid var(--ink-3);outline-offset:1px}
.fi{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.fi:first-child{border-top:0;padding-top:0}
.fi-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.reac{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reac .em{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:.92rem;line-height:1.4}
.reac .em:hover{border-color:var(--ink-3)}
.reac .em[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary)}
.reac .em .num{font-size:.74rem;color:var(--ink-2)}
.cmt{font-size:.88rem;background:var(--surface-2);border-radius:8px;padding:7px 11px}
@media (prefers-reduced-motion:no-preference){.prog i,.br .fill{transition:width .35s ease}}

<script>
/* ===================== Gabinete · motor ===================== */
(function(){
'use strict';
const F = window.GAB_FACTS;
const G = window.G = {};

/* ---------- util ---------- */
const $ = G.$ = (s,r=document)=>r.querySelector(s);
G.$$ = (s,r=document)=>[...r.querySelectorAll(s)];
G.esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n=>String(n).padStart(2,'0');
const iso = G.iso = d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = G.today = ()=>iso(new Date());
const pd = G.pd = s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addDays = G.addDays = (s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff = G.diff = (a,b)=>Math.round((pd(a)-pd(b))/864e5);
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
G.fmt = s=>{const d=pd(s);return pad(d.getDate())+' '+MES[d.getMonth()]+' '+d.getFullYear()};
G.fmtShort = s=>{const d=pd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const uid = G.uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone = o=>JSON.parse(JSON.stringify(o));
const hash = s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)};
/* minúsculas sem acento; 768–879 são os códigos dos acentos combinantes (escrito sem escapes de propósito) */
const norm = G.norm = s=>Array.from(String(s||'').toLowerCase().normalize('NFD')).filter(c=>{const k=c.charCodeAt(0);return k<768||k>879}).join('');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
G.pct = (a,b)=>b?Math.round(a/b*100):0;
G.hm = min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h?h+'h'+(m?pad(m):''):m+'min'};
const weekStart = G.weekStart = s=>{const d=pd(s);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return iso(d)};

/* ---------- disciplinas ---------- */
const DISC = G.DISC = F.DISC;
const byId = G.byId = Object.fromEntries(DISC.map(d=>[d.id,d]));
const byShort = Object.fromEntries(DISC.map(d=>[norm(d.short),d]));
G.discFromLabel = function(label){
  const n=norm(label);
  if(byShort[n]) return byShort[n];
  if(n.includes('direitos humanos')) return byId.dh;
  if(n.includes('humanist')||n.includes('nocoes gerais')) return byId.hum;
  if(n.includes('processual civil')||n.includes('processo civil')) return byId.pc;
  if(n.includes('processual penal')||n.includes('processo penal')) return byId.pp;
  if(n.includes('consumidor')) return byId.con;
  if(n.includes('crianca')||n==='eca') return byId.eca;
  if(n.includes('constitucional')) return byId.cst;
  if(n.includes('eleitoral')) return byId.ele;
  if(n.includes('empresarial')) return byId.emp;
  if(n.includes('tribut')||n.includes('financeiro')) return byId.tri;
  if(n.includes('ambiental')) return byId.amb;
  if(n.includes('administrativo')) return byId.adm;
  if(n.includes('penal')) return byId.pen;
  if(n.includes('civil')) return byId.civ;
  return null;
};

/* ---------- dados embutidos: provas (TJSC e ENAM) e edital ---------- */
/* os mapas de prova foram classificados separadamente: unifica rótulos de capítulo equivalentes */
const MACRO_RULES=[

function readLocal(p,legacy){

function loadState(p){

/* ---------- sincronização plugável ----------
   artifact = banco do próprio Claude (só contas da mesma organização)
   rtdb     = Firebase Realtime Database via REST (site hospedado: qualquer celular, sem conta Claude)
   local    = só este navegador */
const BK = G.backend = {kind:'local',on:false,busy:false,last:0,err:''};
let db=null, flushP=null, flushTimer=null; const pending=new Set();
const RT_URL=/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/, RT_ROOM=/^[A-Za-z0-9]{16,40}$/;
const validCfg = o=>!!(o&&typeof o.u==='string'&&RT_URL.test(o.u)&&typeof o.r==='string'&&RT_ROOM.test(o.r));
const b64e = s=>btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s=>atob(s.replace(/-/g,'+').replace(/_/g,'/'));
G.groupCfg=null;
try{const c=JSON.parse(localStorage.getItem('gabinete-grupo')||'null'); if(validCfg(c)) G.groupCfg={u:c.u,r:c.r}}catch(e){}
try{ /* convite no endereço: …#g=<código> */
  const m=/[#&]g=([A-Za-z0-9_-]+)/.exec(location.hash||'');
  if(m){const o=JSON.parse(b64d(m[1])); if(validCfg(o)){G.groupCfg={u:o.u,r:o.r}; localStorage.setItem('gabinete-grupo',JSON.stringify(G.groupCfg)); history.replaceState(null,'',location.pathname+location.search)}}
}catch(e){}
const rtUrl = path=>G.groupCfg.u+'/rooms/'+G.groupCfg.r+'/'+path+'.json';
async function rtReq(path,method,body){
  const r=await fetch(rtUrl(path),{method,cache:'no-store',body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok) throw {code:'http_'+r.status}; return r.json();
}
const flat = (o,pre,out)=>{Object.entries(o).forEach(([k,v])=>{const p=pre?pre+'/'+k:k; if(v&&typeof v==='object'&&!Array.isArray(v)) flat(v,p,out); else out[p]=v}); return out};
const store = {
  async readMember(p){
    const out={};
    if(BK.kind==='artifact'){const snap=await db.collection('perfis/'+p+'/dados').get();
      snap.docs.forEach(d=>{const b=d.data(); if(b&&DOCS.includes(d.id)&&b.data!=null) out[d.id]={data:clone(b.data),at:b.updatedAt||0}})}
    else if(BK.kind==='rtdb'){const o=await rtReq('perfis/'+p,'GET')||{};
      DOCS.forEach(k=>{const b=o[k]; if(b&&typeof b.json==='string'){try{out[k]={data:JSON.parse(b.json),at:+b.at||0}}catch(e){}}})}
    return out;
  },
  async writeDoc(p,doc,data,at){
    if(BK.kind==='artifact') await db.doc('perfis/'+p+'/dados/'+doc).set({data:clone(data),updatedAt:at});
    else if(BK.kind==='rtdb') await rtReq('perfis/'+p+'/'+doc,'PUT',{json:JSON.stringify(data),at});
  },
  async readShared(name){
    if(BK.kind==='artifact'){const s=await db.doc('grupo/'+name).get(); return s.exists?clone(s.data()):null}
    if(BK.kind==='rtdb') return await rtReq('grupo/'+name,'GET');
    return null;
  },
  async mergeShared(name,patch){
    if(BK.kind==='artifact'){const ref=db.doc('grupo/'+name); try{await ref.update(patch)}catch(e){if(e&&e.code==='invalid_argument') await ref.set(patch); else throw e}}
    else if(BK.kind==='rtdb') await rtReq('grupo/'+name,'PATCH',flat(patch,'',{}));
  }
};
function setSync(s){
  const el=$('#sync'); if(!el) return; el.dataset.s=s;
  el.querySelector('span').textContent = s==='cloud'?(BK.kind==='rtdb'?'Sincronizado com o grupo':'Sincronizado na nuvem'):s==='saving'?'Salvando…':'Salvando só neste aparelho';
}
function queue(doc){ if(BK.kind==='local'||!pid) return; pending.add(doc); setSync('saving'); clearTimeout(flushTimer); flushTimer=setTimeout(flush,900); }
/* carimbos de revisão: cada gravação atualiza grupo/rev/<chave>; quem consulta baixa só esse documento minúsculo
   e busca o progresso de alguém apenas quando o carimbo dele mudou (economiza a franquia gratuita do banco) */
let seen={};
const bump = (key)=>{const at=Date.now(); seen[key]=at; return store.mergeShared('rev',{[key]:at}).catch(()=>{})};
function flush(){
  if(flushP) return flushP;
  flushP=(async()=>{
    const p=pid; let gravou=false; if(!p){pending.clear();return}
    while(pending.size&&BK.kind!=='local'&&p===pid){
      const doc=pending.values().next().value; pending.delete(doc);
      try{await store.writeDoc(p,doc,S[doc],stamps[doc]||Date.now()); gravou=true}
      catch(e){
        const code=e&&e.code;
        if(code==='quota_exceeded'||code==='resource_exhausted'){G.toast('A nuvem recusou a gravação ('+code+'). Seus dados seguem salvos neste aparelho.')}
        else if(BK.kind==='artifact'&&code!=='unavailable'){BK.kind='local';BK.on=false}
        else {pending.add(doc); BK.err=code||'rede'; break}   /* rede instável: tenta de novo na próxima gravação ou atualização */
      }
    }
    if(gravou) await bump(p);
    setSync(BK.kind==='local'?'local':pending.size?'saving':'cloud');
  })().finally(()=>{flushP=null});
  return flushP;
}
G.touch = function(...docs){const t=Date.now(); docs.forEach(d=>{stamps[d]=t; queue(d)}); saveLocal();};

G.addMember = function(nome){
  nome=String(nome||'').trim().replace(/\s+/g,' ').slice(0,40); if(nome.length<2) throw new Error('Informe um nome');
  const id=(norm(nome).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)||'perfil')+'-'+Math.random().toString(36).slice(2,6);
  members[id]={nome,completo:nome,resumo:'',at:Date.now()}; saveMembers();
  if(BK.kind!=='local') store.mergeShared('members',{[id]:members[id]}).then(()=>bump('members')).catch(()=>{});
  return id;

G.refresh = async function(){
  if(BK.kind==='local'||BK.busy) return; BK.busy=true;
  try{
    const rev=await store.readShared('rev')||{}, tudo=!BK.on, mudou=k=>tudo||(rev[k]||0)!==(seen[k]||0);
    if(mudou('members')){
      const m=await store.readShared('members')||{}; let ch=false;
      Object.entries(m).forEach(([id,v])=>{if(v&&typeof v==='object'&&v.nome&&/^[a-z0-9-]{2,30}$/.test(id)&&(!members[id]||(+v.at||0)>(members[id].at||0))){
        members[id]={nome:String(v.nome).slice(0,40),completo:String(v.completo||'').slice(0,60),resumo:String(v.resumo||'').slice(0,120),at:+v.at||0};ch=true}});
      if(ch) saveMembers();
      const falta={}; Object.entries(members).forEach(([id,v])=>{if(!m[id]) falta[id]=v});
      if(Object.keys(falta).length){await store.mergeShared('members',falta); await bump('members')} else seen.members=rev.members||0;
    }
    const my=pid;
    if(my&&mudou(my)){const remote=await store.readMember(my);
      if(my===pid){let changed=false;
        DOCS.forEach(k=>{const r=remote[k];
          if(r&&r.at>(stamps[k]||0)&&!pending.has(k)){S[k]=r.data;stamps[k]=r.at;changed=true}
          else if(stamps[k]&&(!r||r.at<stamps[k])) pending.add(k)});
        seen[my]=rev[my]||0;
        if(changed){normalize(S,my);saveLocal();G.ensureCycle()}
        if(pending.size) flush();}}
    for(const id of Object.keys(members)){ if(id===pid||!(mudou(id)||!G.peerState[id])) continue;
      try{const r=await store.readMember(id); if(Object.keys(r).length){const st=defaults(id); DOCS.forEach(k=>{if(r[k])st[k]=r[k].data}); G.peerState[id]=normalize(st,id)} seen[id]=rev[id]||0}catch(e){} }
    if(mudou('social')){const so=await store.readShared('social'); if(so){G.social={reacoes:so.reacoes||{},comentarios:so.comentarios||{}};saveSocial()} seen.social=rev.social||0}
    BK.on=true; BK.err=''; BK.last=Date.now(); if(!pending.size) setSync('cloud');
  }catch(e){BK.err=(e&&e.code)||'rede'; if(!BK.on) setSync('local')}
  BK.busy=false; if(G.afterRefresh) G.afterRefresh();
};

G.connectGroup = async function(url,room){
  url=String(url||'').trim().replace(/\/+$/,'');
  if(!RT_URL.test(url)) throw new Error('A URL deve ser a do Realtime Database, no formato https://…firebaseio.com ou https://…firebasedatabase.app');
  if(!room){const a=new Uint8Array(24); crypto.getRandomValues(a); room=[...a].map(x=>'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'[x%57]).join('')}
  const antes={cfg:G.groupCfg,kind:BK.kind}; G.groupCfg={u:url,r:room}; BK.kind='rtdb';
  try{await rtReq('grupo/ping','PUT',{at:Date.now()})}
  catch(e){G.groupCfg=antes.cfg;BK.kind=antes.kind; throw new Error('Não consegui gravar nesse banco. Confira a URL e se as regras foram publicadas.')}
  try{localStorage.setItem('gabinete-grupo',JSON.stringify(G.groupCfg))}catch(e){}
  seen={}; BK.on=false; DOCS.forEach(k=>{if(stamps[k]) pending.add(k)});   /* grupo novo: reenvia o que já existe neste aparelho */
  await G.refresh();
};
