  unit(a,btn){const [d,key,f]=a.split('|'); const e=G.EDITAL.find(x=>x.disc.id===d), u=e&&e.unidades.find(x=>x.key===key); if(!u)return;
    G.toggleUnit(u,e.disc,f); btn.setAttribute('aria-pressed',String(!!G.unitState(key)[f])); G.refreshDisc(d); renderNav();
    if(f==='t'&&G.unitState(key).t) G.toast('Teoria marcada — 1ª revisão agendada para amanhã')},
  'rev-done'(id){G.doneReview(id);render();G.toast('Revisão concluída — próxima agendada')},
  'rev-snooze'(a){const [id,n]=a.split('|');G.snoozeReview(id,+n);render()},
  'rev-add'(){dlg('Agendar revisão',`<div class="form-grid"><div class="field"><label for="rv-disc">Disciplina</label><select id="rv-disc" name="disc">${discOpts('civ')}</select></div><div class="field"><label for="rv-due">Para quando</label><input type="date" id="rv-due" name="due" value="${G.addDays(G.today(),1)}"></div></div><div class="field"><label for="rv-t">O que revisar</label><input type="text" id="rv-t" name="titulo" required maxlength="140"></div>`,fd=>{G.addReview(fd.disc,fd.titulo.trim(),fd.due||G.today())})},
  'err-add'(){dlg('Anotar erro',`<div class="form-grid"><div class="field"><label for="er-disc">Disciplina</label><select id="er-disc" name="disc">${discOpts('civ')}</select></div><div class="field"><label for="er-tema">Tema</label><input type="text" id="er-tema" name="tema" required maxlength="100"></div></div><div class="field"><label for="er-nota">Regra correta, em uma frase</label><textarea id="er-nota" name="nota" required maxlength="500" style="min-height:90px"></textarea></div>`,fd=>{S.erros.push({id:G.uid(),d:G.today(),disc:fd.disc,tema:fd.tema.trim(),nota:fd.nota.trim(),ok:false});G.touch('erros')})},
  'err-toggle'(id){const e=S.erros.find(x=>x.id===id);if(e){e.ok=!e.ok;G.touch('erros');render()}},
  'err-del'(id){S.erros=S.erros.filter(x=>x.id!==id);G.touch('erros');render()},
  'sim-add'(tipo){
    if(tipo==='enam'){dlg('Registrar simulado do ENAM',`<div class="form-grid"><div class="field"><label for="se-n">Qual prova</label><input type="text" id="se-n" name="nome" required maxlength="80" placeholder="ex.: ENAM 2026.1 (prova real)"></div><div class="field"><label for="se-d">Data</label><input type="date" id="se-d" name="d" value="${G.today()}"></div><div class="field"><label for="se-t">Acertos (0–80)</label><input type="number" id="se-t" name="total" min="0" max="80" required></div></div><p class="small muted">Depois, lance também os acertos por disciplina em “Registrar estudo” (atividade Simulado): é isso que alimenta a projeção e o diagnóstico.</p>`,fd=>{S.simulados.push({id:G.uid(),tipo:'enam',d:fd.d||G.today(),nome:fd.nome.trim(),total:Math.min(80,+fd.total||0)});G.touch('simulados')});return}
    dlg('Registrar simulado do TJSC',`<div class="form-grid"><div class="field"><label for="sm-n">Nome</label><input type="text" id="sm-n" name="nome" required maxlength="80" placeholder="ex.: TJSC 2024 (prova real)"></div><div class="field"><label for="sm-d">Data</label><input type="date" id="sm-d" name="d" value="${G.today()}"></div></div><div class="form-grid"><div class="field"><label for="sm-1">Acertos Bloco I (0–40)</label><input type="number" id="sm-1" name="b1" min="0" max="40" required></div><div class="field"><label for="sm-2">Bloco II (0–30)</label><input type="number" id="sm-2" name="b2" min="0" max="30" required></div><div class="field"><label for="sm-3">Bloco III (0–30)</label><input type="number" id="sm-3" name="b3" min="0" max="30" required></div></div>`,fd=>{S.simulados.push({id:G.uid(),tipo:'tjsc',d:fd.d||G.today(),nome:fd.nome.trim(),b1:Math.min(40,+fd.b1||0),b2:Math.min(30,+fd.b2||0),b3:Math.min(30,+fd.b3||0)});G.touch('simulados')})},
  'sim-del'(id){const pr=id.indexOf('prova:')===0&&F.PROVAS_REAIS.find(p=>'prova:'+p.id===id);
    if(pr){dlg('Excluir o resultado de '+esc(pr.nome)+'?','<p>Esse simulado veio da folha de respostas. Excluir apaga também as marcações e o resultado da prova.</p>',()=>{G.refazerProva(pr)},'Excluir');return}
    S.simulados=S.simulados.filter(x=>x.id!==id);G.touch('simulados');render()},
  'ses-del'(id){G.delSession(id);render()},
  'treino-tab'(t){ui.treino=t;ui.aiNote='';render()},
  'ai-stop'(){if(ui.aiCtl)ui.aiCtl.abort()},
  'quiz-gen'(){const {d,label}=aiTema(); aiCall(async signal=>{
    const arr=await ui.ai.json(`Você é examinador da FGV elaborando provas objetivas da magistratura (ENAM e Juiz Substituto do TJSC). Gere 5 questões INÉDITAS de múltipla escolha (5 alternativas, só uma correta) sobre: ${label}.\nEstilo: caso prático curto com personagens e pergunta sobre a solução jurídica; alternativas plausíveis, de tamanho parecido, em que saber a conclusão não basta — é preciso o fundamento exato; nível difícil; varie a posição da alternativa correta.\n${FIEL}\nResponda SOMENTE com um array JSON, sem texto fora dele, no formato: [{"enunciado":"...","alternativas":["...","...","...","...","..."],"correta":0,"comentario":"fundamento legal da correta e o erro central das demais"}] — "correta" é o índice (0 a 4).`,{signal,cache:false});
    const items=(Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.enunciado==='string'&&Array.isArray(x.alternativas)&&x.alternativas.length===5&&Number.isInteger(x.correta)&&x.correta>=0&&x.correta<5).map(x=>({enunciado:x.enunciado,alternativas:x.alternativas.map(String),correta:x.correta,comentario:String(x.comentario||''),resp:null}));
    if(!items.length) throw {code:'invalid_json'};
    ui.quiz={disc:d.id,label,items,t0:Date.now(),saved:false}; })},
  'quiz-ans'(a){const [qi,oi]=a.split('|').map(Number); const it=ui.quiz&&ui.quiz.items[qi]; if(it&&it.resp==null){it.resp=oi;render()}},
  'quiz-save'(){const q=ui.quiz;if(!q||q.saved)return; const ok=q.items.filter(i=>i.resp===i.correta).length; G.addSession({disc:q.disc,tipo:'quiz-ia',min:Math.min(90,Math.max(1,Math.round((Date.now()-q.t0)/60000))),q:q.items.length,ok,nota:'Quiz IA: '+q.label.slice(0,120)}); q.saved=true; render(); G.toast('Resultado registrado (não entra na projeção de nota)')},
  'disc-gen'(){const {d,label}=aiTema(); ui.disc={disc:d.id,label,questao:'',resposta:'',feedback:''}; aiCall(async signal=>{
    const r=await ui.ai(`Elabore UMA questão discursiva no padrão da 2ª etapa (prova escrita discursiva, 2,0 pontos por questão) do concurso de Juiz Substituto do TJSC, banca FGV, sobre: ${label}. Caso prático breve seguido de 2 ou 3 perguntas objetivas que exijam fundamento legal e jurisprudência dominante. ${FIEL}\nTraga apenas o enunciado, sem resposta.`,{signal,cache:false,onText:({text})=>{const el=$('#disc-q');if(el){el.hidden=false;el.textContent=text}}});
    ui.disc.questao=r.text; })},
  'disc-grade'(){const x=ui.disc; if(!x||!x.questao)return; if((x.resposta||'').trim().length<80){G.toast('Escreva sua resposta antes de pedir a correção');return}
    x.feedback=''; aiCall(async signal=>{
    const r=await ui.ai(`Você é examinador da 2ª etapa do concurso de Juiz Substituto do TJSC (FGV). Corrija com rigor de banca.\n\nQUESTÃO (vale 2,00):\n${x.questao}\n\nRESPOSTA DO CANDIDATO:\n${x.resposta.slice(0,8000)}\n\nEntregue, nesta ordem: 1) NOTA de 0,00 a 2,00; 2) ESPELHO esperado em tópicos, com a pontuação de cada um; 3) o que o candidato acertou; 4) omissões e erros jurídicos, apontando o fundamento correto; 5) três ajustes de técnica de redação para ganhar ponto (estrutura, objetividade, citação de dispositivo). ${FIEL}`,{signal,cache:false,modelTier:'complex',onText:stream});
    x.feedback=r.text; })},
  'expl-gen'(){const {label}=aiTema(); ui.expl=''; aiCall(async signal=>{
    const r=await ui.ai(`Monte uma ficha de REVISÃO ATIVA para quem estuda para Juiz Substituto do TJSC (banca FGV) sobre: ${label}.\nFormato: 1) 6 a 8 pontos-chave, cada um em uma frase; 2) dispositivos de lei essenciais (diploma e artigo) — só os que você tem certeza; 3) entendimentos consolidados de STF/STJ mais cobrados; 4) três pegadinhas típicas de prova (mesma conclusão com fundamento errado, troca de prazo, exceção invertida); 5) cinco perguntas para eu responder de cabeça, SEM as respostas. ${FIEL}`,{signal,onText:stream});
    ui.expl=r.text; })},
  'cfg-set'(a){const [f,v]=a.split('|'); S.cfg[f]=(f==='enam'||f==='aj')?v:+v; G.touch('cfg'); G.ensureCycle(); ui.rxFam=''; render()},
  nivel(a){const [d,v]=a.split('|'); S.cfg.niveis[d]=+v; G.touch('cfg'); G.ensureCycle(); render()},
  'cfg-save'(){S.cfg.onboarded=true; G.touch('cfg'); G.ensureCycle(true); ui.route='hoje'; render(); window.scrollTo(0,0); G.toast('Perfil salvo — ciclo recalculado')},
  async export(){const data=G.exportData(), name='gabinete-backup-'+G.today()+'.json';
    if(ui.dl){try{await ui.dl.save({filename:name,data});G.toast('Backup salvo');return}catch(e){if(e&&e.code==='declined')return}}
    if(!window.claude){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return}catch(e){}}
    dlg('Copie seu backup',`<p class="small muted">Selecione tudo, copie e guarde em um arquivo .json.</p><textarea readonly id="bk-out" style="min-height:260px;font-family:var(--f-mono);font-size:.78rem">${esc(data)}</textarea>`,()=>true,'Fechar')},
  import(){dlg('Importar backup',`<p class="small muted">Isto substitui os dados atuais pelos do arquivo.</p><div class="field"><label for="im-f">Arquivo .json</label><input type="file" id="im-f" accept=".json,application/json"></div><div class="field"><label for="im-t">ou cole o conteúdo</label><textarea id="im-t" name="txt" style="font-family:var(--f-mono);font-size:.78rem"></textarea></div>`,async(fd,form)=>{
    const f=form.querySelector('#im-f').files[0]; const txt=f?await f.text():(fd.txt||''); if(!txt.trim()) throw new Error('Escolha um arquivo ou cole o backup'); G.importData(txt); G.toast('Backup importado')},'Importar')},
  reset(){dlg('Apagar todos os dados?','<p>Perfil, marcações do edital, registros, revisões, erros e simulados serão apagados desta página e da nuvem. Exporte um backup antes, se tiver dúvida.</p>',()=>{G.resetAll();ui.route='hoje';G.toast('Dados apagados')},'Apagar tudo')}
};
G.dlg=dlg;
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]'); if(!b||b.disabled)return; const fn=A[b.dataset.act]||(G.extraActions||{})[b.dataset.act]; if(fn){e.preventDefault();fn(b.dataset.arg||'',b)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.inp; if(!k)return; const v=e.target.value;
  if(k==='rx-busca'){ui.rxBusca=v;G.rxRefresh()} else if(k==='ai-tema'){ui.aiTema=v} else if(k==='disc-resp'&&ui.disc){ui.disc.resposta=v}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.chg; if(!k)return; const v=e.target.value;
  if(k==='rx-disc'){ui.rxDisc=v;G.rxRefresh()} else if(k==='rx-ano'){ui.rxAno=v;G.rxRefresh()}
  else if(k==='ai-disc'){ui.aiDisc=v;ui.aiUnit='';render()} else if(k==='ai-unit'){ui.aiUnit=v}
  else if(k==='cfg-nome'){S.cfg.nome=v.trim().slice(0,40);G.touch('cfg')}
  else if(k==='cfg-colacao'){S.cfg.colacao=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';G.touch('cfg');render()}});
document.addEventListener('toggle',e=>{const d=e.target; if(d.matches&&d.matches('details.disc')){d.open?ui.open.add(d.dataset.disc):ui.open.delete(d.dataset.disc)}},true);
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t){tip.hidden=true;return}
  tip.textContent=t.dataset.tip; tip.hidden=false; const w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+14,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-10; if(y+h>innerHeight-8)y=e.clientY-h-10; tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px'});
document.addEventListener('mouseleave',()=>{tip.hidden=true});

/* ---------- boot ---------- */
try{const r=localStorage.getItem('gabinete-rota'); if(r&&V[r]&&r!=='perfis'&&r!=='membro')ui.route=r}catch(e){}
ui.timer=G.readTimer();
render();
/* depois de cada sincronização: redesenha só telas que mostram dados do grupo, sem atrapalhar quem está digitando */
G.afterRefresh=function(){
  const a=document.activeElement, digitando=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName), aberto=$('#dlg').open;
  if(digitando||aberto||ui.aiBusy) return;
  if(!G.pid()||['hoje','grupo','membro'].includes(ui.route)) render(); else renderNav();
};
G.initBackend();
setInterval(()=>{if(document.visibilityState==='visible') G.refresh()},75000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-G.backend.last>20000) G.refresh()});
(async()=>{ if(!window.claude||typeof window.claude.use!=='function')return;
  try{ui.ai=await window.claude.use('sample')}catch(e){ui.ai=null}
  try{ui.dl=await window.claude.use('downloads')}catch(e){ui.dl=null}
  if(ui.route==='treino'&&!ui.aiBusy)render(); })();
})();
</script>

</body>
</html>
